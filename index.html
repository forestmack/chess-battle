.nhome{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:150px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px rgba(0,0,0,.3)}
.nhome i{aspect-ratio:1}
.war{background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--nc) 22%,transparent),transparent 60%),linear-gradient(180deg,#18225a,#0b1130)}
.war-top{display:flex;align-items:center;gap:12px}
.war-top .ncrest{width:46px;height:51px}
.war-t{font:900 26px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.war-rows{display:flex;flex-direction:column;gap:10px;margin:16px 0 10px}
.war-row{display:grid;grid-template-columns:22px 26px minmax(0,1fr) auto;gap:10px;align-items:center}
.war-row .pos{font:900 18px/1 var(--display);color:var(--muted);text-align:center}
.war-row .ncrest{width:24px;height:27px}
.war-row .nm{font:800 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--nc)}
.war-row .trk{height:8px;border-radius:4px;background:var(--void);overflow:hidden;margin-top:6px}
.war-row .trk i{display:block;height:100%;border-radius:4px;background:var(--nc);width:0;transition:width .9s var(--ease)}
.war-row .pts{display:flex;align-items:center;gap:4px;font:900 18px/1 var(--display);color:var(--text);font-variant-numeric:tabular-nums}
.war-row .pts .star{width:14px;height:14px}
.war-row.mine{padding:8px;margin:-8px;border-radius:12px;background:color-mix(in srgb,var(--nc) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 35%,transparent)}
.war-me{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.war-me div{padding:10px;border-radius:12px;background:rgba(3,6,20,.45);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.war-me b{display:block;font:900 22px/1 var(--display);color:var(--text)}
.war-me span{font:700 10px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pc-nat{display:flex;align-items:center;gap:8px;font:800 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--nc)}
.pc-nat .ncrest{width:18px;height:20px}
.rw.nat{color:var(--nc)}
.rw .ncrest{width:14px;height:15px;filter:none}
/* ---------- capital (nation home base) ---------- */
.tabs{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.tab-ind{width:20%!important}
.tab.cap{color:var(--nc,var(--muted))}
.tab.cap .capico{position:relative;width:34px;height:34px;margin:-12px 0 -2px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--nc,#7f95ff) 45%,#1a2468),#0b1130);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--nc,#7f95ff) 70%,transparent),0 6px 14px -4px color-mix(in srgb,var(--nc,#7f95ff) 60%,transparent);transition:transform .3s var(--spring)}
.tab.cap .capico .ncrest{width:20px;height:22px;filter:none}
.tab.cap .capico svg.gen{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.tab.cap[aria-current="page"] .capico{transform:translateY(-3px) scale(1.06)}
#scr-nat{--nc:#7f95ff}
.cap-hero{position:relative;overflow:hidden;border-radius:28px;padding:26px 18px 18px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--nc) 45%,transparent),transparent 62%),linear-gradient(180deg,color-mix(in srgb,var(--nc) 18%,#141c52),#0a0f2e);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px color-mix(in srgb,var(--nc) 45%,transparent),0 30px 60px -28px color-mix(in srgb,var(--nc) 60%,#000)}
.cap-hero::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(0deg,rgba(6,10,32,.6),transparent);pointer-events:none}
.cap-sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cap-sky i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:var(--nc);box-shadow:0 0 8px var(--nc);opacity:0;animation:capfloat linear infinite}
@keyframes capfloat{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-320px) translateX(var(--dx,0)) scale(1.1);opacity:0}}
.cap-crest{position:relative;width:118px;height:118px;margin:0 auto 10px;display:grid;place-items:center;z-index:1}
.cap-crest::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--nc),transparent 35%,var(--nc) 55%,transparent 75%);opacity:.45;filter:blur(10px);animation:spinray 8s linear infinite}
.cap-crest .ncrest{width:96px;height:106px;filter:drop-shadow(0 0 22px var(--nc)) drop-shadow(0 10px 18px rgba(0,0,0,.6));animation:float 5s ease-in-out infinite}
.cap-k{position:relative;font:700 11px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--nc);z-index:1}
.cap-t{position:relative;font:900 52px/.9 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:8px 0 6px;z-index:1;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--nc) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.cap-motto{position:relative;font:600 15px/1.35 var(--body);font-style:italic;color:color-mix(in srgb,var(--nc) 35%,#c9d0f5);z-index:1}
.cap-rank{position:relative;z-index:1;margin:16px auto 0;max-width:340px;text-align:left}
.cap-rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.cap-rank-top b{font:900 20px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.cap-rank-top span{font:700 12px/1 var(--body);color:var(--muted);letter-spacing:.06em}
.cap-bar{height:8px;border-radius:4px;background:rgba(3,6,20,.7);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.cap-bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--nc) 55%,#000),var(--nc));box-shadow:0 0 12px var(--nc);transition:width 1s var(--ease)}
.cap-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.cap-stats div{padding:12px 6px;border-radius:14px;background:rgba(3,6,20,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cap-stats b{display:flex;align-items:center;justify-content:center;gap:4px;font:900 24px/1 var(--display);color:var(--text)}
.cap-stats b .star{width:16px;height:16px}
.cap-stats span{display:block;margin-top:6px;font:700 10px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cap-sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px -4px}
.cap-sec .sec-t{color:var(--nc)}
.oath{display:flex;align-items:center;gap:14px;background:linear-gradient(110deg,color-mix(in srgb,var(--nc) 20%,#18225a),#0d1438 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px color-mix(in srgb,var(--nc) 40%,transparent)}
.oath-ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(160deg,var(--nc),color-mix(in srgb,var(--nc) 50%,#000));box-shadow:0 4px 0 color-mix(in srgb,var(--nc) 40%,#000),0 0 20px color-mix(in srgb,var(--nc) 45%,transparent)}
.oath-ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.oath.done .oath-ic{background:rgba(75,227,180,.15);box-shadow:inset 0 0 0 1.5px rgba(75,227,180,.5)}
.oath.done .oath-ic svg{stroke:var(--mint)}
.oath-btn{all:unset;cursor:pointer;flex:none;padding:12px 14px;border-radius:13px;font:900 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:#120a00;background:linear-gradient(180deg,color-mix(in srgb,var(--nc) 30%,#fff),var(--nc));box-shadow:0 4px 0 color-mix(in srgb,var(--nc) 45%,#000);animation:pulse 1.6s ease-in-out infinite}
.oath-btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--nc) 45%,#000)}
.oath-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.orders .ord{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(43,56,120,.6)}
.orders .ord:first-of-type{border-top:0;padding-top:2px}
.ord-n{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:900 16px/1 var(--display);color:var(--nc);background:rgba(3,6,20,.6);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 40%,transparent)}
.ord.done .ord-n{color:#062a1f;background:var(--mint);box-shadow:none}
.ord .bar{height:6px;margin-top:8px}
.ord .bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--nc) 55%,#000),var(--nc))}
.ord-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ord-top small{font:800 12px/1 var(--display);color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.camp-medal{display:flex;align-items:center;gap:12px;margin-top:6px;padding:12px;border-radius:16px;background:linear-gradient(90deg,color-mix(in srgb,var(--nc) 18%,transparent),transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 35%,transparent)}
.camp-medal .ncrest{width:34px;height:38px}
.drill{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}
.drill .mini{width:96px;transform:none;border-radius:10px;box-shadow:0 0 0 2px color-mix(in srgb,var(--nc) 50%,transparent),0 10px 18px -8px rgba(0,0,0,.7)}
.drill-k{font:700 10px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--nc)}
.drill-t{font:900 22px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:6px 0 4px}
.drill-st{display:flex;gap:12px;margin:8px 0 10px;font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drill-st b{font:900 15px/1 var(--display);color:var(--text);margin-right:3px}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.skill{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:12px 10px;border-radius:16px;position:relative;background:linear-gradient(180deg,#18225a,#0d1438);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(43,56,120,.9),0 4px 0 #050a1c;transition:transform .14s var(--spring)}
.skill:active{transform:translateY(3px)}
.skill:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.skill.done{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1.5px color-mix(in srgb,var(--nc) 70%,transparent),0 4px 0 #050a1c}
.skill-n{font:900 22px/1 var(--display);color:var(--nc)}
.skill-t{font:800 14px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.skill-s{font:500 11.5px/1.3 var(--body);color:var(--muted)}
.skill .ok{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:#062a1f;font:900 11px/1 var(--display)}
.lesson-d{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:min(230px,70%);margin:6px auto 0;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px rgba(0,0,0,.3),0 16px 28px -12px rgba(0,0,0,.7)}
.lesson-d i{aspect-ratio:1;display:grid;place-items:center;position:relative}
.lesson-d i.hl::after{content:"";position:absolute;inset:8%;border-radius:50%;box-shadow:inset 0 0 0 3px var(--nc);background:color-mix(in srgb,var(--nc) 25%,transparent)}
.lesson-d svg{width:86%;height:86%;position:relative;z-index:1}
.lesson-body{font:500 15px/1.5 var(--body);color:var(--text);margin:14px 0}
.lesson-body p{margin:0 0 10px}
.ranks-l{display:flex;flex-direction:column}
.rk-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(43,56,120,.5)}
.rk-row:first-child{border-top:0}
.rk-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:900 14px/1 var(--display);color:var(--muted);background:rgba(3,6,20,.6);box-shadow:inset 0 0 0 1.5px var(--line)}
.rk-row.got .rk-ic{color:#120a00;background:var(--nc);box-shadow:0 0 12px color-mix(in srgb,var(--nc) 60%,transparent)}
.rk-row.cur{background:color-mix(in srgb,var(--nc) 10%,transparent);margin:0 -10px;padding:10px;border-radius:12px;border-top-color:transparent}
.rk-row .row-t{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:16px}
.rk-row.lock .row-t{color:var(--muted)}
.rk-req{display:flex;align-items:center;gap:4px;font:800 14px/1 var(--display);color:var(--gold)}
.rk-req .star{width:13px;height:13px}
.cd .star{width:13px;height:13px;vertical-align:-1px}
.creed{text-align:center;padding:22px 18px;background:radial-gradient(100% 80% at 50% 0%,color-mix(in srgb,var(--nc) 18%,transparent),transparent 70%),linear-gradient(180deg,#141c52,#0b1130)}
.creed q{display:block;font:900 26px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--nc);quotes:"“" "”"}
.creed p{font:500 14.5px/1.55 var(--body);color:var(--muted);margin:12px 0 0}
.join-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.join-card{padding:14px 12px;border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--nc) 16%,#18225a),#0d1438);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px color-mix(in srgb,var(--nc) 40%,transparent)}
.join-card .ncrest{width:34px;height:38px}
.join-card b{display:block;font:900 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--nc);margin:10px 0 4px}
.join-card span{font:500 12px/1.35 var(--body);color:var(--muted)}
@media (min-width:700px){.skills{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* ---------- server: leaderboards, quick match, account ---------- */
.lb{display:flex;flex-direction:column}
.lb-row{display:grid;grid-template-columns:26px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(43,56,120,.5)}
.lb-row:first-child{border-top:0}
.lb-row .pos{font:900 17px/1 var(--display);color:var(--muted);text-align:center}
.lb-row.top1 .pos{color:var(--gold)}.lb-row.top2 .pos{color:#dfe6f2}.lb-row.top3 .pos{color:#e6a57a}
.lb-row.me{background:rgba(255,204,46,.08);margin:0 -10px;padding:9px 10px;border-radius:12px;border-top-color:transparent}
.lb-name{display:flex;align-items:center;gap:6px;font:800 15px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;min-width:0}
.lb-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name .ncrest{width:15px;height:17px;flex:none}
.lb-sub{font:600 11px/1 var(--body);color:var(--muted);letter-spacing:.06em;margin-top:4px}
.lb-pts{display:flex;align-items:center;gap:4px;font:900 17px/1 var(--display);font-variant-numeric:tabular-nums}
.lb-pts .star{width:14px;height:14px}
.lb-empty{padding:18px 6px;text-align:center;font:500 13.5px/1.4 var(--body);color:var(--muted)}
.war-row .mem{font:600 10.5px/1 var(--body);color:var(--muted);letter-spacing:.06em;margin-left:6px;text-transform:none}
.qm{display:flex;align-items:center;gap:14px;background:radial-gradient(120% 120% at 100% 0%,rgba(75,227,180,.22),transparent 60%),linear-gradient(180deg,#18225a,#0d1438);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(75,227,180,.35)}
.qm-ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(160deg,#a7f5dc,var(--mint));box-shadow:0 4px 0 #1b7a5c}
.qm-ic svg{width:26px;height:26px;stroke:#062a1f;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.qm .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);margin-right:6px;animation:pulse 1.4s ease-in-out infinite}
.search-ring{width:84px;height:84px;border-radius:50%;margin:4px auto 6px;position:relative;display:grid;place-items:center;background:radial-gradient(circle,rgba(75,227,180,.25),transparent 70%)}
.search-ring::before,.search-ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--mint);animation:ping 1.8s ease-out infinite}
.search-ring::after{animation-delay:.9s}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.5);opacity:0}}
.search-ring svg{width:38px;height:38px}
.acct{display:flex;align-items:center;gap:12px}
.acct-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--muted)}
.acct-dot.on{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.emailin{all:unset;box-sizing:border-box;width:100%;height:52px;padding:0 16px;border-radius:14px;background:var(--void);box-shadow:inset 0 0 0 1.5px var(--line);font:600 17px/1 var(--body);color:var(--text)}
.emailin:focus{box-shadow:inset 0 0 0 2px var(--gold)}
/* ---------- desktop layout (mobile stays exactly as is) ---------- */
.side-brand{display:none}
@media (min-width:1000px){
  body:not(.in-game){padding-left:268px;padding-right:32px}
  .tabbar{left:0;top:0;bottom:0;right:auto;width:232px;padding:26px 16px;border-top:0;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:26px;background:rgba(6,11,32,.86)}
  .tabbar.away{transform:translateX(-110%)}
  .side-brand{display:flex;align-items:center;gap:9px;padding:0 8px;font:900 21px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
  .side-brand b{color:var(--gold)}
  .side-brand .crest{width:30px;height:30px}
  .tabs{display:flex!important;flex-direction:column;gap:6px;max-width:none;margin:0}
  .tab-ind{display:none!important}
  .tab{flex-direction:row;justify-content:flex-start;gap:14px;padding:13px 14px;border-radius:14px;font-size:13px;letter-spacing:.14em;transition:background .2s,color .2s}
  .tab:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .tab[aria-current="page"]{background:rgba(255,204,46,.12);box-shadow:inset 0 0 0 1px rgba(255,204,46,.2)}
  .tab.cap[aria-current="page"]{background:color-mix(in srgb,var(--nc,#7f95ff) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc,#7f95ff) 40%,transparent)}
  .tab.cap .capico{width:28px;height:28px;margin:-4px 0;border-radius:9px}
  .tab.cap .capico .ncrest{width:17px;height:19px}
  .tab.cap[aria-current="page"] .capico{transform:none}

<script>
/* ================= constants & utils ================= */
const SIDE=['Black','White'];
const NAME={K:'king',Q:'queen',R:'rook',B:'bishop',N:'knight',P:'pawn'};
const VAL={P:1,N:3,B:3,R:5,Q:9,K:0};
const PRICE={P:1,N:4,B:4,R:6,Q:12};
const SHOP=['P','N','B','R','Q'];
const FILES='abcdefgh';
const ARTIFACT_URL='https://claude.ai/artifact/SaJZM1YEUWNHifS4oogSEf';
const $=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n);
const sqName=i=>FILES[i&7]+(8-(i>>3));
const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svgPiece=(t,cls='')=>`<svg class="pcs${t==='K'?' pk':''} ${cls}" viewBox="0 0 100 100" aria-hidden="true"><use href="#s-${t}" width="100" height="100"/><use href="#ov-orbit" width="100" height="100" style="display:var(--ovd,none)"/></svg>`;
const crest=(cls='')=>`<span class="crest ${cls}"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#s-Q" width="100" height="100"/></svg></span>`;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const PID=(()=>{let id=store.get('cb-pid');if(!id){id='p'+Math.random().toString(36).slice(2,12);store.set('cb-pid',id)}return id})();
const reduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};

/* ================= profile ================= */
const DEF_P=()=>({name:'',av:'Q',avc:'gold',rating:700,crowns:150,xp:0,claimed:[],owned:['b-amethyst','t-gold','f-coins','snd-wood','ti-rookie'],
  equip:{board:'b-amethyst',trim:'t-gold',fx:'f-coins',snd:'snd-wood',title:'ti-rookie',set:'classic'},legacy:{pts:0,peak:0,un:['classic'],games:0},nation:null,natGiven:0,oath:{last:0,streak:0,best:0,total:0},train:{n:0,solved:0,streak:0,best:0,day:0,today:0},learned:[],camp:null,war:{month:'',tally:{},mine:0,w:0,l:0,d:0},rh:[],days:{},by:{buy:{},cap:{}},rec:{fast:0,gold:0,caps:0,bestOpp:0},peak:0,since:0,
  stats:{games:0,wins:0,losses:0,draws:0,streak:0,best:0,caps:0,buys:0,earned:0,mates:0},
  ach:[],hist:[],set:{sound:true,haptics:true,flip:true},daily:{last:0,streak:0,best:0},seen:false,tips:{},vs:{easy:{w:0,l:0,d:0},medium:{w:0,l:0,d:0},hard:{w:0,l:0,d:0}},bestDaily:0});
function loadP(){
  const d=DEF_P();let p;try{p=JSON.parse(store.get('cb-profile')||'null')}catch(e){p=null}
  if(!p||typeof p!=='object')return d;
  for(const k in d){if(p[k]==null)p[k]=d[k];else if(d[k]!==null&&typeof d[k]==='object'&&!Array.isArray(d[k])&&typeof p[k]==='object'&&!Array.isArray(p[k]))p[k]={...d[k],...p[k]}}
  return p;

/* ---- realtime connection over Supabase: same interface as a PeerJS connection ---- */
function rtConn(code,opt={}){
  const ch=sb.channel('cb-'+code,{config:{broadcast:{self:false},presence:{key:(NET.uid||'anon')+(opt.watch?':w':'')}}});
  const c={peer:'rt',open:false,h:{},closed:false,watch:!!opt.watch,
    on(e,f){(this.h[e]=this.h[e]||[]).push(f)},emit(e,...a){(this.h[e]||[]).forEach(f=>{try{f(...a)}catch(err){console.warn(err)}})},
    send(d){try{ch.send({type:'broadcast',event:'m',payload:d})}catch(e){}return true},
    close(){if(this.closed)return;this.closed=true;const was=this.open;this.open=false;try{sb.removeChannel(ch)}catch(e){}if(was)this.emit('close')}};
  ch.on('broadcast',{event:'m'},m=>{if(!c.closed)c.emit('data',m&&m.payload)});
  if(!opt.watch)ch.on('presence',{event:'sync'},()=>{if(c.closed)return;let n=0;try{n=Object.keys(ch.presenceState()).filter(k=>!k.endsWith(':w')).length}catch(e){}
    if(n>=2&&!c.open){c.open=true;c.emit('open')}else if(n<2&&c.open){c.open=false;c.emit('close')}});
  ch.subscribe(async st=>{if(st==='SUBSCRIBED'&&!opt.watch&&!c.closed){try{await ch.track({at:Date.now()})}catch(e){}}});
  return c;
}

/* ---- quick match: the server pairs two searching players, then they connect peer to peer ---- */
let qmTimer=null;
function qmStop(leave){clearTimeout(qmTimer);qmTimer=null;if(leave&&NET.on)rpc('leave_match_queue').catch(()=>{})}
async function quickMatch(){
  if(!netCfg()){openSetup('invite');return}
  if(!(await netInit())){toast('Can’t reach the Chess Battle server. Check your connection, or invite a friend with a link.');return}
  if(!P.nation){showNationPick();toast('Join a nation first. Quick matches count for your nation.');return}
  guardForfeit();if(guardPending)await guardPending.catch(()=>{});
  let code='';for(let k=0;k<6;k++)code+=CODE_ABC[rand(CODE_ABC.length)];
  const ok=await hostOnline('5',{code,quick:true});if(!ok)return;
  let polls=0;
  const poll=async()=>{
    if(!isOnline()||S.online.code!==code||S.online.ready){qmStop(false);return}
    polls++;
    try{
      const r=await rpc('find_match',{p_code:code});
      if(!isOnline()||S.online.code!==code)return;
      if(r.role==='join'&&r.code&&r.code!==code){qmStop(false);await joinOnline(r.code,true,{quick:true});return}
      if(r.role==='guard'&&r.guard){qmStop(false);guardFound(r);return}
      const w=$('qmCount');if(w)w.textContent=r.matched?'Opponent found. Connecting…':`${pl(Math.max(1,Number(r.waiting)||1),'player')} searching`;
    }catch(e){}
    qmTimer=setTimeout(poll,polls<20?2500:4000);
  };
  poll();
}

function adoptCloud(c){

}

/* ---------- daily puzzle: checkmate in one ---------- */
const isMateFor=(b,w)=>inCheck(b,w)&&!anyLegal(b,w);
function genPuzzle(n){
  const R=seeded(n*31+7),ri=k=>Math.floor(R()*k);
  for(let tries=0;tries<9000;tries++){
    const b=Array(64).fill(null),put=(t,w,lo,hi)=>{for(let g=0;g<40;g++){const i=(lo+ri(hi-lo+1))*8+ri(8);if(!b[i]){b[i]={t,w};return i}}return -1};
    const bk=put('K',0,0,1),wk=put('K',1,4,7);if(bk<0||wk<0)continue;
    if(Math.abs((bk>>3)-(wk>>3))<=1&&Math.abs((bk&7)-(wk&7))<=1)continue;
    const wp=['Q','R','R','B','N','N','B','Q'],bp=['P','P','P','N','B','R'];
    const nw=2+ri(2),nb=1+ri(3);let bad=false;
    for(let k=0;k<nw;k++)if(put(wp[ri(wp.length)],1,1,6)<0)bad=true;
    for(let k=0;k<nb;k++){const t=bp[ri(bp.length)];if(put(t,0,t==='P'?1:0,t==='P'?2:2)<0)bad=true}
    if(bad||inCheck(b,0)||inCheck(b,1))continue;
    if(b.some((p,i)=>p&&p.t==='P'&&((p.w&&i<8)||(!p.w&&i>=56))))continue;
    const sols=[];
    for(let i=0;i<64&&sols.length<2;i++){const p=b[i];if(!p||!p.w)continue;for(const t of pseudo(b,i)){const nb2=apply(b,i,t);if(inCheck(nb2,1))continue;if(isMateFor(nb2,0)){sols.push([i,t]);if(sols.length>1)break}}}
    if(sols.length!==1)continue;
    let id=1;b.forEach(p=>{if(p)p.id=id++});
    return {b,sol:sols[0],nid:id};
  }
  return null;
}
function getPuzzle(){
  const n=dailyNo(),k='cb-puz-'+n;let pz=null;
  try{pz=JSON.parse(store.get(k)||'null')}catch(e){}
  if(!pz){pz=genPuzzle(n);if(pz)store.set(k,JSON.stringify(pz))}
  return pz;
}

/* ================= game review: where the game turned ================= */
function armyOf(b,w){let v=0;for(const p of b)if(p&&p.w===w&&p.t!=='K')v+=VAL[p.t];return v}
function reviewData(){
  if(!S||!S.frames||S.frames.length<3)return null;
  const me=fixedSide()!=null?fixedSide():(S.over&&S.over.win!=null?S.over.win:1);
  const bal=S.frames.map(f=>armyOf(f.b,me)-armyOf(f.b,1-me));
  let worst=null,best=null;
  for(let i=1;i<bal.length;i++){const d=bal[i]-bal[i-1];
    if(d<0&&(!worst||d<worst.d))worst={i,d};
    if(d>0&&(!best||d>best.d))best={i,d}}
  return {me,bal,worst,best};
}
function lostPiece(i,me){const a=S.frames[i-1].b,b=S.frames[i].b;for(const t of ['Q','R','B','N','P']){const c0=a.filter(p=>p&&p.w===me&&p.t===t).length,c1=b.filter(p=>p&&p.w===me&&p.t===t).length;if(c1<c0)return NAME[t]}return 'material'}
function wonPiece(i,me){const a=S.frames[i-1].b,b=S.frames[i].b;for(const t of ['Q','R','B','N','P']){const c0=a.filter(p=>p&&p.w===1-me&&p.t===t).length,c1=b.filter(p=>p&&p.w===1-me&&p.t===t).length;if(c1<c0)return NAME[t]}return 'material'}
function openReview(){
  const d=reviewData();if(!d){toast('Play a few more moves to get a review.');return}
  const {bal,worst,best,me}=d,mx=Math.max(4,...bal.map(Math.abs)),W=320,H=110,n=bal.length;
  const x=i=>(i/(Math.max(1,n-1)))*W,y=v=>H/2-v/mx*(H/2-6);
  const path=bal.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area=`${path} L${x(n-1).toFixed(1)} ${H/2} L0 ${H/2} Z`;
  const turn=i=>Math.ceil(i/2);
  const mark=(o,c)=>o?`<circle cx="${x(o.i).toFixed(1)}" cy="${y(bal[o.i]).toFixed(1)}" r="6" fill="${c}" stroke="#0b1130" stroke-width="2"/>`:'';
  $('sheetTitle').textContent='Game review';
  $('sheetBody').innerHTML=`<p class="row-s" style="margin:0">Army value, you versus your opponent, after every turn. Above the line you’re ahead.</p>
    <svg class="rv-graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Army balance over the game"><line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="rgba(255,255,255,.18)" stroke-dasharray="4 4"/><path d="${area}" fill="rgba(255,204,46,.14)"/><path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>${mark(worst,'#ff5e78')}${mark(best,'#4be3b4')}</svg>
    <div>${worst?`<div class="rv-item"><span class="rv-ic bad">${worst.d}</span><div><div class="row-t">Turning point · turn ${turn(worst.i)}</div><div class="row-s">You lost a ${esc(lostPiece(worst.i,me))} here. Look at the move just before it: what was left unprotected?</div></div><button class="ghost" type="button" data-act="rvshow" data-i="${Math.max(0,worst.i-1)}">Show me</button></div>`:''}
    ${best?`<div class="rv-item"><span class="rv-ic good">+${best.d}</span><div><div class="row-t">Best moment · turn ${turn(best.i)}</div><div class="row-s">You won a ${esc(wonPiece(best.i,me))}.</div></div><button class="ghost" type="button" data-act="rvshow" data-i="${best.i}">Show me</button></div>`:''}
    ${!worst&&!best?'<div class="lb-empty">No material changed hands. A quiet game.</div>':''}</div>
    <div style="height:10px"></div><button class="b3d block" type="button" data-act="replay">Replay the whole game</button>`;

function openSheet(kind){

  else{
    $('sheetTitle').textContent='Game';
    body.innerHTML=`${S&&!S.over&&S.mode!=='puzzle'?`<div class="row"><div><div class="row-t">${resignArm?'Resign this game?':'Resign'}</div><div class="row-s">${resignArm?'Counts as a loss.':'Give up the current game'}</div></div>${resignArm?'<div class="pair"><button class="ghost" type="button" data-act="noresign">Keep playing</button><button class="b3d danger sm" type="button" data-act="yesresign">Resign</button></div>':'<button class="ghost" type="button" data-act="resign">Resign</button>'}</div>`:''}
    ${isOnline()?`<div class="row"><div><div class="row-t">Online · ${S.online.code}</div><div class="row-s">You play ${SIDE[S.online.me]}</div></div><div class="pair"><button class="ghost" type="button" data-act="copyinvite">Copy link</button><button class="ghost" type="button" data-act="leaveonline">Leave</button></div></div>`:''}
    ${S&&fixedSide()==null?`<div class="row"><div><div class="row-t">Flip board each turn</div><div class="row-s">Turn off when playing across a table</div></div><button class="switch" type="button" role="switch" aria-checked="${!!S.autoFlip}" aria-label="Flip board each turn" data-act="flip"><span></span></button></div>`:''}
    <details class="fold"><summary>How to play</summary><ul class="rules">
      <li><b>Armies</b><span>King, 3 pawns and a knight each, randomly placed and mirrored.</span></li>
      <li><b>Gold</b><span>Start with 3. It carries over, and the only income is captures: pawn 1, knight 3, bishop 3, rook 5, queen 9.</span></li>
      <li><b>Turn</b><span>Move one piece, or buy as many pieces as you can afford, then end your turn.</span></li>
      <li><b>Shop</b><span>Pawn 1, knight 4, bishop 4, rook 6, queen 12. Pawns on your pawn row, others on your back row.</span></li>
      <li><b>Limits</b><span>No buying the same piece twice in a row. Max 8 pawns.</span></li>
      <li><b>Suicide</b><span>End your turn with your king attacked and you lose instantly.</span></li>
      <li><b>Nations</b><span>Everyone fights for one of four nations. Online wins earn your nation 5 stars, losses cost 3, and draws give both sides 1, all doubled on war weekends. Pick a front on the territory map and your wins fight for that region. The top nation each month wins.</span></li>
      <li><b>Premove</b><span>Against a bot or online, tap or drag your piece while your opponent thinks. It plays the moment your turn starts, if it’s still possible.</span></li>
      <li><b>Victory</b><span>Checkmate, suicide, resignation or time. No safe move and nothing to buy is a draw, as are 30 turns each without a capture, buy or pawn move, and bare kings with no gold left.</span></li></ul></details>
    <details class="fold"><summary>Move history</summary><ol class="histlist">${S?S.log.map(x=>`<li>${esc(x)}</li>`).join(''):''}</ol></details>`;
  }
  $('sheetWrap').hidden=false;
}

const vAt=(x,y)=>{const r=boardEl.getBoundingClientRect();const c=Math.floor((x-r.left)/r.width*8),rr=Math.floor((y-r.top)/r.height*8);return inB(rr,c)?rr*8+c:-1};
const clearHover=()=>markEls.forEach(m=>m.classList.remove('hover'));

cellsEl.addEventListener('pointerdown',e=>{
  if(!S)return;ac();

    try{cellsEl.setPointerCapture(e.pointerId)}catch(_){}
    if(mouse)dragTo(e);
  }else drag={i,tap:true,id:e.pointerId};
});
function dragTo(e){
  const d=drag;if(!d||!d.el)return;
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>=(d.mouse?3:6))d.moved=true;
  if(!d.on&&!d.mouse&&!d.moved)return;
  if(!d.on){d.on=true;boardEl.classList.add('dragging');document.body.classList.add('dragging')}
  const r=boardEl.getBoundingClientRect(),sq=r.width/8,el=d.el;
  el.classList.add('drag');el.style.transitionDelay='0ms';el.style.transform=`translate(${e.clientX-r.left-sq/2}px,${e.clientY-r.top-sq*(d.mouse?.5:.66)}px)`;
}
cellsEl.addEventListener('contextmenu',e=>e.preventDefault());
cellsEl.addEventListener('pointermove',e=>{
  if(!drag||drag.tap||e.pointerId!==drag.id)return;
  dragTo(e);if(!drag.on)return;
  const v=vAt(e.clientX,e.clientY),t=v<0?-1:idxAt(v),hv=(drag.pre?S.preTgts:S.tgts).includes(t)&&t!==drag.i?v:-1;
  if(hv!==drag.hv){clearHover();if(hv>=0){markEls[hv].classList.add('hover');vibrate(5)}drag.hv=hv}
});
function endDrag(e,cancel){
  if(e&&e.button===2&&arStart>=0&&!cancel){const v=vAt(e.clientX,e.clientY),t=v<0?-1:idxAt(v);if(t>=0){if(t===arStart)toggleIn(AR.marks,t);else toggleIn(AR.arrows,`${arStart}-${t}`);renderArrows()}arStart=-1;return}
  if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;clearHover();boardEl.classList.remove('dragging');document.body.classList.remove('dragging');
  if(d.tap){if(!cancel){const v=vAt(e.clientX,e.clientY);if(v>=0&&idxAt(v)===d.i)clickSq(d.i)}return}
  if(!d.on||!d.moved){if(d.on){d.el.classList.remove('drag');d.el.classList.add('snap');setTimeout(()=>d.el.classList.remove('snap'),200)}if(d.wasSel&&!cancel){if(d.pre){clearPreSel();renderTray()}else{S.sel=null;S.tgts=[]}}renderBoard();return}
  const el=d.el;el.classList.remove('drag');el.classList.add('snap');setTimeout(()=>el.classList.remove('snap'),200);
  const v=cancel?-1:vAt(e.clientX,e.clientY),t=v<0?-1:idxAt(v);
  if(d.pre){if(t>=0&&t!==d.i&&S.preTgts.includes(t)&&canPremove()&&S.b[d.i])setPremove(d.i,t);else renderBoard();return}
  if(t>=0&&S.tgts.includes(t))doMove(d.i,t);else{if(t>=0&&t!==d.i){vibrate(4);sfx('illegal')}renderBoard()}
}
