<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta property="og:image" content="https://forestmack.github.io/chess-battle/og.png">
<meta property="og:image:width" content="1200">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Chess Battle">
<meta property="og:title" content="Chess Battle">
<meta property="og:description" content="Capture to earn gold. Buy reinforcements. Checkmate your friends.">
<title>Chess Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Layout: an app shell. Tab screens (Play, Ranks, Shop, Profile) above a frosted tab bar; the game is a full-screen view with the board as centerpiece and your treasury tray fixed below. */
:root{
  --ink:#060b20; --plum:#0e1538; --plum-2:#141d48; --plum-3:#1d2a63; --line:#2b3878; --text:#eef1ff; --muted:#9ea8db;
  --sq-l:#e4e9ff; --sq-d:#4f67d8;
  --gold:#ffcc2e; --gold-hi:#fff0a8; --gold-lo:#a37800; --void:#03061a;
  --mint:#4be3b4; --red:#ff5268;
  --pw-fill:#fcf8ef; --pw-stroke:#0d1336; --pb-fill:#1a2560; --pb-stroke:#050821;
  --trim-w:#e0a800; --trim-b:#ffcc2e;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --spring:cubic-bezier(.3,1.4,.5,1); --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;
  background-image:radial-gradient(90% 50% at 50% 30%,#1a2a6e 0%,rgba(26,42,110,0) 70%);background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* ---------- screens ---------- */
.screen{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.screen.game{padding-bottom:28px;gap:12px}
.screen.game>.frame{width:min(100%,max(288px,calc(100vh - 474px)));width:min(100%,max(288px,calc(100dvh - 474px)));align-self:center;box-sizing:border-box}
@media (max-height:800px) and (max-width:899px){.screen.game{gap:9px;padding-bottom:14px}.screen.game>.frame{width:min(100%,max(276px,calc(100dvh - 458px)))}}
@media (min-width:900px) and (min-height:560px){
  .screen.game{max-width:none;width:fit-content;display:grid;grid-template-columns:min(calc(100vh - 150px),calc(100vw - 460px),760px) 380px;grid-template-areas:"top top" "opp mv" "board side";grid-template-rows:auto auto auto;column-gap:28px;row-gap:12px;align-items:start;padding-bottom:24px}
  .screen.game>.gtop{grid-area:top}.screen.game>.opp{grid-area:opp}.screen.game>.frame{grid-area:board;width:100%}
  .screen.game>.mvbar{grid-area:mv;align-self:center}.screen.game>.tray,.screen.game>.replaybar{grid-area:side;align-self:end}
  .seat-name{max-width:260px}
}
.screen.enter{animation:screenin .42s var(--ease) both}
@keyframes screenin{from{opacity:0;transform:translateY(12px) scale(.985)}}
.stagger>*{animation:rise-in .5s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}
@keyframes rise-in{from{opacity:0;transform:translateY(14px)}}
.h-title{font:900 34px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.h-sub{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec-t{font:800 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}

/* ---------- header & chips ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;overflow:hidden;font:900 clamp(17px,5.4vw,23px)/1 var(--display);letter-spacing:.07em;text-transform:uppercase;min-width:0;white-space:nowrap}
.brand b{color:var(--gold);font-weight:900}
.crest{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,var(--gold-hi) 0 15%,var(--gold) 50%,var(--gold-lo));
  box-shadow:0 2px 0 #6b4f00,inset 0 0 0 2px rgba(255,255,255,.28)}
.crest svg{width:68%;height:68%;fill:#3a2a00;stroke:none;--acc:#3a2a00;margin-top:-1px}
.crest.sm{width:18px;height:18px;box-shadow:0 1px 0 #6b4f00,inset 0 0 0 1px rgba(255,255,255,.3)}
.chips{display:flex;gap:6px;align-items:center}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 6px;border-radius:17px;flex:none;background:var(--plum-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px var(--line);font:800 17px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums;transition:transform .15s var(--spring)}
.chip:active{transform:scale(.95)}
.chip svg.badge-t{width:22px;height:22px}
.icon-btn{all:unset;box-sizing:border-box;cursor:pointer;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,var(--plum-3),var(--plum-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 0 #060b20,0 0 0 1px var(--line);color:var(--text);transition:transform .12s var(--spring),box-shadow .12s}
.icon-btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 #060b20,0 0 0 1px var(--line)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.dots i{display:block;width:4px;height:4px;border-radius:50%;background:var(--text);box-shadow:0 -7px 0 var(--text),0 7px 0 var(--text)}
.gtop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.glabel{text-align:center;min-width:0}
.glabel .h-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabel .gname{font:900 20px/1.05 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gright{display:flex;gap:8px}

/* ---------- 3D buttons ---------- */
.b3d,.cta{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 22px;border-radius:16px;
  font:900 20px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:#1f1600;white-space:nowrap;
  background:linear-gradient(180deg,#fff0a8 0%,var(--gold) 50%,#e0a800 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(120,70,0,.25),0 5px 0 #8a6500,0 16px 28px -12px rgba(255,204,46,.7);
  transition:transform .14s var(--spring),box-shadow .14s,filter .2s}
.b3d::after,.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);transform:translateX(-120%);pointer-events:none}
.b3d.shine::after,.cta.shine::after{animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.b3d:active,.cta:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(120,70,0,.25),0 1px 0 #8a6500,0 6px 14px -8px rgba(255,204,46,.5)}
.b3d:focus-visible,.cta:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.b3d.block,.cta{width:100%}
.b3d.sm,.cta.sm{height:42px;padding:0 18px;font-size:17px;border-radius:13px;width:auto}
.b3d.alt{color:var(--text);background:linear-gradient(180deg,#2a3a8c,#18235e);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.2),0 5px 0 #070c24,0 14px 26px -14px rgba(0,0,0,.7)}
.b3d.alt:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 0 #070c24}
.b3d.mint{color:#062a1f;background:linear-gradient(180deg,#a7f5dc,var(--mint) 55%,#2fc595);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 5px 0 #1b7a5c,0 16px 28px -12px rgba(75,227,180,.55)}
.b3d.mint:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 #1b7a5c}
.b3d.danger{color:#fff;background:linear-gradient(180deg,#ff8a98,var(--red) 55%,#d93349);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 5px 0 #8a1a2a}
.b3d.danger:active{box-shadow:0 1px 0 #8a1a2a}
.b3d:disabled{cursor:default;filter:grayscale(.7) brightness(.7);transform:none}
.b3d svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ghost{all:unset;box-sizing:border-box;cursor:pointer;height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:12px;font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--text);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);transition:transform .12s var(--spring),background .15s}
.ghost:active{transform:scale(.96);background:rgba(255,255,255,.08)}
.ghost:disabled{opacity:.4;cursor:default}
.ghost:focus-visible{outline:2px solid var(--gold-hi)}
.pair{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.tagapp{font:800 9px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:var(--void);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- panels & tiles ---------- */
.panel{position:relative;border-radius:22px;padding:16px;background:linear-gradient(180deg,#18225a,#0b1130);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(43,56,120,.9),0 22px 40px -22px rgba(0,0,0,.8)}
.panel.hero{padding:18px;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,rgba(255,204,46,.22),rgba(255,204,46,0) 55%),linear-gradient(180deg,#1a2560,#0b1130)}
.hero-row{display:flex;gap:16px;align-items:center}
.hero-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.hero-k{font:700 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi)}
.hero-t{font:900 32px/.95 var(--display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.hero-s{font:500 14px/1.35 var(--body);color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:118px;flex:none;aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px #1d2766,0 14px 24px -10px rgba(0,0,0,.7);transform:rotate(-4deg)}
.mini i{display:block;position:relative;background:var(--sq-l)}
.mini i.d{background:var(--sq-d)}
.mini i svg{position:absolute;inset:4%;width:92%;height:92%}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;min-height:132px;
  background:linear-gradient(180deg,#18225a,#0d1438);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(43,56,120,.9),0 5px 0 #050a1c,0 18px 30px -18px rgba(0,0,0,.8);
  transition:transform .14s var(--spring),box-shadow .14s}
.tile:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(43,56,120,.9),0 1px 0 #050a1c}
.tile:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.tile-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px -6px rgba(0,0,0,.6)}
.tile-ic svg{width:22px;height:22px;stroke:#0d1336;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ic-gold{background:linear-gradient(160deg,var(--gold-hi),var(--gold))}
.ic-mint{background:linear-gradient(160deg,#b4f7e2,var(--mint))}
.ic-lilac{background:linear-gradient(160deg,#e6dcff,#a58cf0)}
.ic-rose{background:linear-gradient(160deg,#ffd0d6,#f08a9a)}
.tile-t{font:900 21px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.tile-s{font:500 13px/1.3 var(--body);color:var(--muted);margin-top:-4px}
.tile .seg{margin-top:auto}
.resume{display:flex;align-items:center;gap:12px}
.resume .grow{flex:1;min-width:0}
.row-t{font:700 15px/1.2 var(--body)}
.row-s{font:500 13px/1.35 var(--body);color:var(--muted);margin-top:3px}
.bar{height:10px;border-radius:5px;background:var(--void);box-shadow:inset 0 1px 2px rgba(0,0,0,.8);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-hi));width:0;transition:width .9s var(--ease)}
.season{display:flex;flex-direction:column;gap:10px}
.season-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvl{font:900 26px/1 var(--display);color:var(--gold);letter-spacing:.04em}

/* ---------- segmented ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:12px;background:var(--void);position:relative}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px 0;border-radius:9px;font:800 14px/1 var(--display);letter-spacing:.04em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;color:var(--muted);transition:background .2s,color .2s,transform .12s var(--spring)}
.seg button:active{transform:scale(.94)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1f1600;box-shadow:0 2px 0 var(--gold-lo)}
.seg button:focus-visible{outline:2px solid var(--gold-hi)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(6,11,32,.8);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid rgba(255,255,255,.06);transition:transform .35s var(--ease)}
.tabbar.away{transform:translateY(110%)}
.tabs{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.tab-ind{position:absolute;top:0;bottom:0;left:0;width:25%;padding:0 6px;transition:transform .45s var(--spring);pointer-events:none}
.tab-ind::before{content:"";display:block;height:100%;border-radius:14px;background:rgba(255,204,46,.12);box-shadow:inset 0 0 0 1px rgba(255,204,46,.18)}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;font:700 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
.tab[aria-current="page"]{color:var(--gold)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
.tab:focus-visible{outline:2px solid var(--gold-hi);border-radius:12px}

/* ---------- seats ---------- */
.opp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;min-height:40px;position:relative}
.seat{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--plum-2)}
.avatar.tw{box-shadow:0 0 0 2px var(--pw-fill)}
.avatar.tb{box-shadow:0 0 0 2px #4a5cc0}
.avatar svg{width:28px;height:28px;margin-top:-2px}
.avt{display:grid;place-items:center;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 30%,#1e2a6a,#0d1438);box-shadow:0 0 0 2px var(--c),0 6px 14px -6px rgba(0,0,0,.6)}
.avt svg{width:72%;height:72%;margin-top:-6%}
.seat-name{font:800 19px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.seat-sub{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.next{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.next .seat-sub{margin:0}
.next-num{display:flex;align-items:center;gap:6px;font:800 21px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.tag{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--gold);padding:3px 5px;border-radius:5px}
.coin{width:12px;height:12px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,var(--gold-hi) 0 20%,var(--gold) 52%,var(--gold-lo));box-shadow:0 1px 0 rgba(0,0,0,.5)}
.bubble{position:absolute;z-index:8;padding:8px 12px;border-radius:14px;background:var(--text);color:var(--ink);font:900 17px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 10px 24px -8px rgba(0,0,0,.6);animation:bub 2.4s var(--ease) forwards;pointer-events:none;white-space:nowrap}
.bubble.top{left:52px;top:-4px}
.bubble.bot{left:58px;top:-14px}
@keyframes bub{0%{opacity:0;transform:translateY(8px) scale(.7)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* ---------- board ---------- */
.frame{padding:8px;border-radius:20px;background:linear-gradient(180deg,#1f2c70,#0c1236);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px var(--line),0 6px 0 #050a1c,0 28px 48px -16px rgba(0,0,0,.75)}
.board{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;border-radius:11px;overflow:hidden;container-type:inline-size}
.board.flipping{animation:breathe .72s cubic-bezier(.7,0,.3,1)}
@keyframes breathe{50%{transform:scale(.972)}}
.cells,.marks{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}
.cells{touch-action:none}
.cell.own{cursor:grab}
body.dragging,body.dragging *{cursor:grabbing!important}
.board.dragging .pieces{z-index:4}
.board.history .cells{cursor:default}
.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.histbadge{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:5;padding:6px 12px;border-radius:12px;background:rgba(3,6,20,.82);color:var(--text);font:800 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
.mvbar{display:flex;align-items:center;gap:6px;min-height:36px}
.mvlist{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.mvlist::-webkit-scrollbar{display:none}
.mvn{flex:none;font:700 12px/32px var(--body);color:var(--muted);padding:0 2px 0 6px;font-variant-numeric:tabular-nums}
.mv{all:unset;flex:none;cursor:pointer;font:600 14px/1 var(--body);color:var(--text);padding:9px 8px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mv:hover{background:rgba(255,255,255,.06)}
.mv.on{background:rgba(255,204,46,.16);box-shadow:inset 0 0 0 1px rgba(255,204,46,.35);color:var(--gold-hi)}
.mv:focus-visible{outline:2px solid var(--gold-hi)}
.mvempty{font:600 13px/32px var(--body);color:var(--muted);padding-left:4px}
.mvnav{all:unset;flex:none;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line);color:var(--text)}
.mvnav:disabled{opacity:.35;cursor:default}
.mvnav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mvnav.live{width:auto;min-width:56px;height:34px;display:inline-grid;padding:0 12px;box-sizing:border-box;font:800 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:#1f1600;background:var(--gold);box-shadow:0 2px 0 var(--gold-lo)}
.clock{flex:none;min-width:64px;padding:7px 9px;border-radius:10px;text-align:center;font:800 22px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--muted);background:rgba(3,6,20,.6);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,color .2s,box-shadow .2s}
.clock.run{color:#0b1130;background:linear-gradient(180deg,#f4f6ff,#cdd6ff);box-shadow:0 0 0 1px rgba(255,255,255,.4),0 6px 16px -6px rgba(127,149,255,.6)}
.clock.low{color:#fff;background:linear-gradient(180deg,#ff8a98,var(--red));box-shadow:0 6px 16px -6px rgba(255,82,104,.7)}
.clock.low.run{animation:lowpulse 1s ease-in-out infinite}
@keyframes lowpulse{50%{filter:brightness(1.18)}}
.oppr{display:flex;align-items:center;gap:10px}
.tcseg{grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-flow:row}
.setup-k{font:700 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.marks{pointer-events:none;z-index:3}
.cell{all:unset;display:block;position:relative;cursor:pointer;min-width:0;min-height:0;overflow:hidden;transition:background-color .4s}
.cell.l{background:var(--sq-l)}
.cell.d{background:var(--sq-d)}
.cell:focus-visible{outline:2px solid var(--gold-hi);outline-offset:-2px}
.cell.last::before,.cell.sel::before{content:"";position:absolute;inset:0;background:#fff09a;opacity:.82}
.cell.d.last::before{background:#d8c24a;opacity:.86}
.cell.sel::before{background:#ffe36b;opacity:.9}
.cell.d.sel::before{background:#e6c62e;opacity:.92}
.cell.check::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,82,104,.95) 0,rgba(255,82,104,.55) 34%,rgba(255,82,104,0) 72%);animation:pulse 1.2s ease-in-out infinite}
.coord{position:absolute;font:700 clamp(8px,2.3cqw,11px)/1 var(--body);z-index:1;pointer-events:none}
.coord.rk{left:4%;top:5%}
.coord.fl{right:5%;bottom:4%}
.cell.l .coord{color:var(--sq-d)}
.cell.d .coord{color:var(--sq-l)}
.board.flipping .coord{animation:coordin .72s ease both}
@keyframes coordin{0%,65%{opacity:0}100%{opacity:1}}
.mark{position:relative}
.mark.tgt::after{content:"";position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(8,14,52,.36)}
.mark.cap::after{content:"";position:absolute;inset:5%;border-radius:50%;border:clamp(3px,.9cqw,5px) solid rgba(8,14,52,.42)}
.mark.place::after{content:"";position:absolute;inset:9%;border-radius:24%;border:2px solid var(--mint);background:rgba(75,227,180,.2);box-shadow:0 0 14px rgba(75,227,180,.6);animation:pulse 1.1s ease-in-out infinite}
.cell.pre::before{content:"";position:absolute;inset:0;background:var(--red);opacity:.38}
.cell.presel::before{content:"";position:absolute;inset:0;background:var(--red);opacity:.55}
.mark.ptgt::after{content:"";position:absolute;left:38%;top:38%;width:24%;height:24%;border-radius:50%;background:rgba(255,82,104,.55)}
.mark.hover::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 clamp(3px,.9cqw,5px) var(--gold-hi);background:rgba(255,240,168,.18)}
@keyframes pulse{50%{opacity:.55}}
.pieces{position:absolute;inset:0;pointer-events:none;z-index:2}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .2s cubic-bezier(.25,.8,.25,1);will-change:transform}
.board.flipping .pc{transition-duration:.66s;transition-timing-function:cubic-bezier(.7,0,.3,1)}
.board.replay .pc{transition-duration:.34s}
.pc::before{content:"";position:absolute;left:19%;right:19%;bottom:6%;height:13%;border-radius:50%;background:radial-gradient(closest-side,rgba(4,8,30,.5),rgba(4,8,30,0));transition:transform .18s,opacity .18s}
.pc-in{position:absolute;inset:0;transition:transform .18s var(--ease)}
.pc .pcs{position:absolute;left:7%;top:2%;width:86%;height:86%;overflow:visible}
.pc.sel .pc-in{transform:translateY(-9%) scale(1.07)}
.pc.sel::before{transform:scale(.78);opacity:.55}
.pc.enter .pc-in{animation:drop .46s var(--ease) both}
@keyframes drop{0%{transform:translateY(-34%) scale(1.3);opacity:0}55%{opacity:1;transform:translateY(3%) scale(.95)}100%{transform:none}}
.pc.leave .pc-in{animation:poof .2s ease-in .13s forwards}
.pc.leave::before{opacity:0}
@keyframes poof{to{transform:scale(.35) rotate(-14deg);opacity:0}}
.pc.drag{z-index:5;transition:none!important}
.pc.drag .pc-in{transform:translateY(-4%) scale(1.28);transition:transform .14s var(--ease)}
.pc.drag::before{transform:translateY(38%) scale(1.15);opacity:.35}
.pc.drag .pcs{filter:drop-shadow(0 10px 10px rgba(3,6,20,.45))}
.tb.drag .pcs{filter:drop-shadow(0 0 1px rgba(200,212,255,.5)) drop-shadow(0 10px 10px rgba(3,6,20,.45))}
.pc.snap{transition-duration:.16s!important}
.pcs{fill:var(--fill);stroke:var(--stroke);stroke-width:var(--psw,4.5);stroke-linejoin:round;stroke-linecap:round;filter:var(--pf,none);color:var(--glow,transparent)}
.tw{--fill:var(--wf);--stroke:var(--ws);--acc:var(--wa);--pf:var(--wp);--glow:var(--wg);--orb:var(--wo)}
.tb{--fill:var(--bf);--stroke:var(--bs);--acc:var(--ba);--pf:var(--bp);--glow:var(--bg);--orb:var(--bo)}
.tw .pk,.tw.pk{--fill:var(--wfk)}
.tb .pk,.tb.pk{--fill:var(--bfk)}
.pk{animation:var(--pka,none) 2.6s ease-in-out infinite}
@keyframes neonk{0%,100%{filter:drop-shadow(0 0 2px currentColor) drop-shadow(0 0 5px currentColor)}50%{filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 0 13px currentColor)}}
/* legacy piece sets: every set defines every variable so previews can nest inside another set */
:root,[data-pset="classic"]{--wf:var(--pw-fill);--ws:var(--pw-stroke);--wa:var(--trim-w);--wp:none;--wg:transparent;--wo:transparent;--wfk:var(--pw-fill);
  --bf:var(--pb-fill);--bs:var(--pb-stroke);--ba:var(--trim-b);--bp:drop-shadow(0 0 1px rgba(200,212,255,.5));--bg:transparent;--bo:transparent;--bfk:var(--pb-fill);--psw:4.5;--pka:none;--ovd:none}
[data-pset="marble"]{--wf:url(#lg-mw);--ws:#2a2e3c;--wa:#c9a14a;--wp:drop-shadow(0 1px 0 rgba(0,0,0,.18));--wg:transparent;--wo:transparent;--wfk:url(#lg-mw);
  --bf:url(#lg-mb);--bs:#05060a;--ba:#e3c46e;--bp:drop-shadow(0 0 1px rgba(255,255,255,.55));--bg:transparent;--bo:transparent;--bfk:url(#lg-mb);--psw:4;--pka:none;--ovd:none}
[data-pset="neon"]{--wf:#eafcff;--ws:#00a9d6;--wa:#00e5ff;--wp:drop-shadow(0 0 2px #00e5ff) drop-shadow(0 0 6px rgba(0,229,255,.55));--wg:#00e5ff;--wo:transparent;--wfk:#eafcff;
  --bf:#1c0629;--bs:#ff3fd8;--ba:#ff3fd8;--bp:drop-shadow(0 0 2px #ff3fd8) drop-shadow(0 0 6px rgba(255,63,216,.55));--bg:#ff3fd8;--bo:transparent;--bfk:#1c0629;--psw:4;--pka:neonk;--ovd:none}
[data-pset="forged"]{--wf:url(#lg-fw);--ws:#4a2e00;--wa:#d8213f;--wp:drop-shadow(0 1px 1px rgba(60,35,0,.35));--wg:transparent;--wo:transparent;--wfk:url(#lg-fwa);
  --bf:url(#lg-fb);--bs:#06080f;--ba:#38c8ff;--bp:drop-shadow(0 0 1px rgba(220,230,255,.65));--bg:transparent;--bo:transparent;--bfk:url(#lg-fba);--psw:4;--pka:none;--ovd:none}
[data-pset="prism"]{--wf:url(#lg-pw);--ws:#2f3590;--wa:#ffffff;--wp:drop-shadow(0 0 3px rgba(190,220,255,.75));--wg:transparent;--wo:transparent;--wfk:url(#lg-pwa);
  --bf:url(#lg-pb);--bs:#d6dcff;--ba:#7ef9ff;--bp:drop-shadow(0 0 3px rgba(150,180,255,.75));--bg:transparent;--bo:transparent;--bfk:url(#lg-pba);--psw:3.6;--pka:none;--ovd:none}
[data-pset="celestial"]{--wf:url(#lg-cw);--ws:#5a3000;--wa:#ff8a1e;--wp:drop-shadow(0 0 4px rgba(255,190,70,.8));--wg:transparent;--wo:#ffcf5a;--wfk:url(#lg-cwa);
  --bf:url(#lg-cb);--bs:#bba9ff;--ba:#ffd36b;--bp:drop-shadow(0 0 3px rgba(150,120,255,.9));--bg:transparent;--bo:#bba9ff;--bfk:url(#lg-cba);--psw:3.6;--pka:none;--ovd:inline}
@media (prefers-reduced-motion: reduce){.tw .pk,.tw.pk{--fill:var(--wf)}.tb .pk,.tb.pk{--fill:var(--bf)}.pk{animation:none!important}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.float{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;gap:3px;
  font:900 clamp(16px,5.2cqw,26px)/1 var(--display);color:var(--gold-hi);text-shadow:0 2px 0 var(--gold-lo),0 0 14px rgba(255,204,46,.7);animation:rise .95s var(--ease) forwards}
.float .coin{width:.62em;height:.62em}
@keyframes rise{0%{transform:translateY(10%) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-20%) scale(1.15)}100%{transform:translateY(-120%) scale(1);opacity:0}}
.spark{position:absolute;width:1.4%;height:1.4%;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px var(--gold);animation:spark .7s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.shock{position:absolute;width:12.5%;height:12.5%;border-radius:50%;border:3px solid var(--gold-hi);animation:shock .6s var(--ease) forwards}
@keyframes shock{from{transform:scale(.3);opacity:1}to{transform:scale(2.6);opacity:0;border-width:1px}}

.result{position:absolute;inset:0;z-index:6;display:grid;place-items:center;overflow:auto;background:rgba(4,8,26,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .35s ease both}
.result-card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px;max-width:100%}
.result-k{font:700 13px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi)}
.result-t{font:900 clamp(38px,14cqw,68px)/.9 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--gold);text-shadow:0 4px 0 var(--gold-lo),0 0 30px rgba(255,204,46,.35);animation:pop .6s var(--spring) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.result-s{font:600 14px/1.35 var(--body);color:var(--text);opacity:.85;max-width:32ch}
.rewards{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:2px 0}
.rw{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:10px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font:800 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;animation:rise-in .5s var(--ease) both}
.rw:nth-child(2){animation-delay:.1s}.rw:nth-child(3){animation-delay:.2s}
.rw.up{color:var(--mint)}.rw.down{color:var(--red)}.rw.g{color:var(--gold)}
.result .pair{margin-top:4px}
.code{font:900 clamp(40px,14cqw,64px)/1 var(--display);letter-spacing:.14em;color:var(--gold);text-shadow:0 3px 0 var(--gold-lo)}
.linkbox{max-width:100%;padding:8px 10px;border-radius:9px;background:var(--void);border:1px solid var(--line);font:500 12px/1.35 var(--body);color:var(--muted);word-break:break-all;user-select:text;-webkit-user-select:text;white-space:pre-wrap;text-align:left}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,204,46,.2);border-top-color:var(--gold);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}

/* ---------- tray ---------- */
.tray.over .pips,.tray.over .breakdown,.tray.over .shop{display:none}
.tray.over .action:empty{display:none}
.linkbtn{all:unset;cursor:pointer;font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-radius:10px}
.linkbtn:focus-visible{outline:2px solid var(--gold-hi)}
.caps{display:flex;flex-wrap:wrap;gap:0;margin-top:5px;min-height:14px;align-items:center}
.caps svg{width:15px;height:15px;margin-right:-3px}
.caps em{font:800 12px/1 var(--display);color:var(--muted);font-style:normal;margin-left:6px;letter-spacing:.04em}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle;background:var(--muted);box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.live.on{background:var(--mint);box-shadow:0 0 10px var(--mint)}
.warn{color:var(--gold-hi)}
.vsrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-top:1px solid rgba(43,56,120,.6)}
.vsrow:first-child{border-top:0}
.vsrow .rec{font:800 18px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:right}
.vsrow .ok{color:var(--mint)}
.tray{background:linear-gradient(180deg,var(--plum-2),var(--plum));border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px var(--line)}
.tray.locked .shop,.tray.locked .action{opacity:.45;pointer-events:none;transition:opacity .2s}
.tray-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bank{display:flex;align-items:baseline;gap:6px}
.bank-num{font:900 42px/.85 var(--display);color:var(--gold);text-shadow:0 2px 0 var(--gold-lo);font-variant-numeric:tabular-nums;min-width:1.1ch;text-align:right;display:inline-block}
.bank-num.bump{animation:bump .3s var(--ease)}
@keyframes bump{40%{transform:scale(1.18)}}
.bank-lbl{font:700 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pips{display:flex;align-items:center;gap:5px}
.pips-base,.pips-x{display:flex;align-items:center;gap:5px;flex:10 1 0;min-width:0}
.pips-x{flex:0 1 auto;padding-left:7px;border-left:2px solid var(--line)}
.pip{flex:1 1 0;max-width:27px;min-width:8px;aspect-ratio:1;border-radius:50%;background:var(--void);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.07);transform:scale(.84);
  transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
.pips-x .pip{width:clamp(8px,6vw,27px);flex:none}
.pip.on{transform:scale(1);background:radial-gradient(circle at 35% 30%,var(--gold-hi) 0 16%,var(--gold) 48%,var(--gold-lo));box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 7px rgba(255,204,46,.35)}
.pip.x.on{background:radial-gradient(circle at 35% 30%,#fffbe6 0 22%,#ffd84a 55%,#e2960a);box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 12px rgba(255,216,74,.85)}
.pip.cost{animation:cost .8s ease-in-out infinite}
@keyframes cost{50%{opacity:.35;transform:scale(.88)}}
.breakdown{display:flex;gap:8px;flex-wrap:wrap;font:600 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-height:12px}
.breakdown .sp{color:var(--gold)}
.shop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:14px;
  background:linear-gradient(180deg,#18225a,#0b1130);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px var(--line),0 4px 0 #050a1c;
  transition:transform .16s var(--spring),box-shadow .16s,background .2s}
.card .pcs{width:74%;max-width:48px;aspect-ratio:1;height:auto;display:block}
.card:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.card:not(:disabled):active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px var(--line),0 0 0 #050a1c}
.card:disabled{cursor:default;background:rgba(27,20,49,.55);box-shadow:0 0 0 1px rgba(43,56,120,.6)}
.card:disabled .pcs,.card:disabled .price{opacity:.3;filter:saturate(.2)}
.card.armed{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px var(--gold),0 4px 0 var(--gold-lo),0 12px 24px -8px rgba(255,204,46,.6);transform:translateY(-4px)}
.badge{position:absolute;top:-7px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 9px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:3px 5px;border-radius:5px;background:var(--void);border:1px solid var(--line);color:var(--muted)}
.price{display:flex;align-items:center;gap:4px;font:800 17px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.price .coin{width:10px;height:10px}
.action{min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px}
.hint{margin:0;font:600 14px/1.3 var(--body);color:var(--muted);text-align:center}
.hint.alert{color:var(--red)}
.swap{animation:swapin .45s var(--ease) both}
@keyframes swapin{from{opacity:0;transform:translateY(7px)}}
.replaybar{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;background:linear-gradient(180deg,var(--plum-2),var(--plum));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px var(--line)}
.rp-ctrl{display:flex;align-items:center;justify-content:center;gap:10px}
.rp-ctrl .icon-btn{width:48px;height:48px}
.rp-ctrl .icon-btn.big{width:60px;height:60px;border-radius:50%;color:#1f1600;background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 var(--gold-lo)}
.rp-ctrl .icon-btn.big svg{fill:#1f1600;stroke:#1f1600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--void)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 2px 0 var(--gold-lo),0 4px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--void)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:var(--gold)}
.rp-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- ranks ---------- */
.rank-hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 16px}
.rank-hero .badge-t{width:116px;height:116px;filter:drop-shadow(0 16px 24px rgba(0,0,0,.55));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.rank-name{font:900 38px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.rank-num{font:800 18px/1 var(--display);letter-spacing:.1em;color:var(--gold)}
.ladder{display:flex;gap:6px;justify-content:space-between}
.ladder div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 9px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:.45}
.ladder div.on{opacity:1;color:var(--text)}
.ladder svg{width:34px;height:34px;flex:none}
.ladder span{min-height:18px;display:flex;align-items:flex-start;text-align:center}
.lb{display:flex;flex-direction:column}
.lb-row{display:grid;grid-template-columns:28px 34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid rgba(43,56,120,.6)}
.lb-row:first-child{border-top:0}
.lb-row.me{background:rgba(255,204,46,.08);border-radius:12px;border-top-color:transparent}
.lb-pos{font:900 18px/1 var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lb-row:nth-child(1) .lb-pos{color:var(--gold)}
.lb-name{font:700 15px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-val{display:flex;align-items:center;gap:6px;font:800 18px/1 var(--display);font-variant-numeric:tabular-nums}
.lb-val .badge-t{width:20px;height:20px}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font:500 14px/1.45 var(--body)}

/* ---------- shop ---------- */
.wallet{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wallet-n{display:flex;align-items:center;gap:8px;font:900 34px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.wallet-n .crest{width:30px;height:30px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 20px)/3.15);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:18px;
  background:linear-gradient(180deg,#18225a,#0b1130);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(43,56,120,.9),0 4px 0 #050a1c;transition:transform .14s var(--spring),box-shadow .14s}
.item:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(43,56,120,.9),0 1px 0 #050a1c}
.item.eq{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px var(--gold),0 4px 0 var(--gold-lo)}
.item:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.swatch{aspect-ratio:1;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.swatch i{display:block}
.swatch.trim,.swatch.fxs{display:grid;place-items:center;grid-template-columns:1fr;background:radial-gradient(circle at 50% 35%,#1e2a6a,#0a1030)}
.swatch.trim svg{width:70%;height:70%}
.swatch.fxs span{font:900 24px/1 var(--display);color:var(--gold-hi);text-shadow:0 0 14px var(--gold)}
.item-n{font:800 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.item-p{display:flex;align-items:center;justify-content:center;gap:5px;font:800 14px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.item-p.own{color:var(--muted)}
.item-p.eqd{color:var(--mint)}
.track{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.node{flex:none;width:86px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.node-l{font:800 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.reward{height:78px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px;text-align:center;
  background:linear-gradient(180deg,#18225a,#0b1130);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(43,56,120,.9);font:800 13px/1.05 var(--display);letter-spacing:.06em;text-transform:uppercase}
.reward.pro{background:linear-gradient(180deg,#3a2a14,#211607);box-shadow:inset 0 1px 0 rgba(255,240,168,.15),0 0 0 1px #5c4313;color:var(--gold-hi)}
.reward.lock{opacity:.45}
.reward.ready{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 2px var(--mint),0 0 18px rgba(75,227,180,.35)}
.reward.done{opacity:.6}
.reward .ok{color:var(--mint)}
.claim{all:unset;cursor:pointer;font:800 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:#062a1f;background:var(--mint);padding:4px 7px;border-radius:6px}
.pro-card{background:radial-gradient(120% 100% at 0% 0%,rgba(255,240,168,.25),rgba(255,240,168,0) 50%),linear-gradient(180deg,#3a2a14,#1f1508);box-shadow:inset 0 1px 0 rgba(255,240,168,.2),0 0 0 1px #5c4313,0 22px 40px -22px rgba(0,0,0,.8)}
.pro-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pro-list li{display:flex;gap:10px;align-items:center;font:600 14px/1.3 var(--body)}
.pro-list li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg);flex:none}

/* ---------- profile ---------- */
.me-head{display:flex;align-items:center;gap:14px}
.me-head .avt{width:72px;height:72px}
.namein{all:unset;box-sizing:border-box;width:100%;min-width:0;font:900 28px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:6px 0;border-bottom:2px solid var(--line);user-select:text;-webkit-user-select:text}
.namein:focus{border-bottom-color:var(--gold)}
.picker{display:flex;gap:8px;flex-wrap:wrap}
.pick{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--plum-2);box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s var(--spring)}
.pick:active{transform:scale(.9)}
.pick[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px rgba(255,204,46,.35)}
.pick svg{width:26px;height:26px}
.pick i{display:block;width:20px;height:20px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px 6px;border-radius:14px;background:rgba(6,3,13,.5);text-align:center;box-shadow:inset 0 0 0 1px rgba(43,56,120,.7)}
.stat b{display:block;font:900 26px/1 var(--display);color:var(--text);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:5px;font:700 10px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ach{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:700 10px/1.15 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ach i{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--void);box-shadow:inset 0 0 0 1px var(--line)}
.ach i svg{width:30px;height:30px;fill:var(--plum-3);stroke:none;--acc:var(--plum-3)}
.ach.on{color:var(--text)}
.ach.on i{background:linear-gradient(160deg,var(--gold-hi),var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 0 var(--gold-lo),0 10px 20px -8px rgba(255,204,46,.6)}
.ach.on i svg{fill:#3a2a00;--acc:#3a2a00}
.hist{display:flex;flex-direction:column}
.h-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid rgba(43,56,120,.6)}
.h-row:first-child{border-top:0}
.h-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.h-dot.w{background:var(--mint)}.h-dot.l{background:var(--red)}
.h-d{font:800 16px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.h-d.up{color:var(--mint)}.h-d.down{color:var(--red)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(43,56,120,.6)}
.set-row:first-child{border-top:0}
.switch{all:unset;cursor:pointer;flex:none;width:52px;height:32px;border-radius:16px;background:var(--void);position:relative;box-shadow:inset 0 0 0 1px var(--line);transition:background .25s}
.switch span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--muted);box-shadow:0 2px 4px rgba(0,0,0,.4);transition:transform .3s var(--spring),background .2s}
.switch[aria-checked="true"]{background:var(--gold-lo)}
.switch[aria-checked="true"] span{transform:translateX(20px);background:var(--gold-hi)}
.switch:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* ---------- sheets, modals, toasts ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,6,20,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .2s ease both}
.sheet{width:100%;max-width:480px;max-height:86vh;overflow:auto;background:var(--plum-2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:6px;animation:sheetup .36s var(--ease) both}
@keyframes sheetup{from{transform:translateY(60px);opacity:0}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:2px 0 6px}
.sheet-title{font:900 24px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.fold{border-top:1px solid var(--line);padding:12px 0 0}
.fold summary{font:700 15px var(--body);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding-bottom:12px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";font:800 20px/1 var(--display);color:var(--gold)}
.fold[open] summary::after{content:"–"}
.rules{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:grid;grid-template-columns:86px 1fr;gap:10px;font:500 14px/1.4 var(--body);color:var(--muted)}
.rules b{font:800 15px/1.35 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.histlist{margin:0 0 12px;padding:0 0 0 24px;font:500 14px/1.55 var(--body);color:var(--muted);max-height:220px;overflow:auto;user-select:text;-webkit-user-select:text}
.histlist:empty::before{content:"No moves yet.";margin-left:-24px}
.emotes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.emote{all:unset;cursor:pointer;text-align:center;padding:14px 0;border-radius:14px;background:linear-gradient(180deg,#22307a,#16205a);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 #070c24;font:900 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;transition:transform .12s var(--spring)}
.emote:active{transform:translateY(3px);box-shadow:0 1px 0 #070c24}
.modal-wrap{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(3,6,20,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s ease both}
.modal{width:100%;max-width:380px;border-radius:26px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,204,46,.2),rgba(255,204,46,0) 60%),linear-gradient(180deg,#1a2560,#0b1130);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px var(--line),0 30px 60px -20px rgba(0,0,0,.8);animation:modalin .45s var(--spring) both}
@keyframes modalin{from{transform:scale(.88) translateY(14px);opacity:0}}
.modal .result-t{font-size:clamp(36px,11vw,52px)}
.modal .introart{width:96px;height:96px;display:grid;place-items:center;border-radius:28px;background:linear-gradient(160deg,var(--gold-hi),var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 0 var(--gold-lo),0 20px 30px -10px rgba(255,204,46,.55);animation:float 4s ease-in-out infinite}
.modal .introart svg{width:64px;height:64px;fill:#fcf8ef;stroke:#0d1336;stroke-width:4.5;stroke-linejoin:round;--acc:#a37800}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0}
.dots .dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .3s var(--spring),background .3s}
.dots .dot.on{background:var(--gold);width:20px;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(420px,calc(100% - 32px));padding:12px 16px;border-radius:14px;background:var(--text);color:var(--ink);font:600 14px/1.35 var(--body);text-align:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.6)}
.toast.show{animation:toastin .35s var(--spring) both}
.in-game .toast{bottom:auto;top:calc(70px + env(safe-area-inset-top,0px))}
.toast.coach{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1f1600;text-align:left;display:flex;gap:10px;align-items:flex-start;box-shadow:0 4px 0 var(--gold-lo),0 18px 34px -12px rgba(0,0,0,.6)}
.toast.coach b{font:900 13px/1.35 var(--display);letter-spacing:.12em;text-transform:uppercase;flex:none}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px) scale(.95)}}
.banner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:61;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:24px;background:linear-gradient(180deg,#22307a,#121a48);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px rgba(255,204,46,.35),0 18px 34px -12px rgba(0,0,0,.7);animation:bannerin 3.2s var(--ease) forwards;white-space:nowrap}
.banner .crest{width:32px;height:32px}
.banner .bn{display:flex;flex-direction:column;gap:4px;min-width:0}
.banner .bn-t{font:900 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.banner .bn-s{font:600 12px/1.2 var(--body);color:var(--muted)}
@keyframes bannerin{0%{opacity:0;transform:translate(-50%,-30px) scale(.9)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
#confetti{position:fixed;inset:0;z-index:58;pointer-events:none;width:100%;height:100%}
.haptic{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}


/* ================= meta screens: ranks, shop, profile ================= */
:root{--r-common:#9ea8db;--r-rare:#6fb6ff;--r-epic:#c08cff;--r-legendary:#ffcc2e}
.rc-common{--rc:var(--r-common)}.rc-rare{--rc:var(--r-rare)}.rc-epic{--rc:var(--r-epic)}.rc-legendary{--rc:var(--r-legendary)}
.rar{font:800 11px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--rc)}
.cd{font:800 13px/1 var(--display);letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px -4px}
.sec-row .sec-t{margin:0}
.kpi{font:900 34px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* rank hero with progress ring */
.rk-hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 16px 18px;position:relative;overflow:hidden}
.rk-hero::before{content:"";position:absolute;inset:-40% -20% auto;height:120%;background:radial-gradient(closest-side,var(--tg,rgba(255,204,46,.25)),transparent);opacity:.55;pointer-events:none}
.ring{position:relative;width:176px;height:176px;display:grid;place-items:center}
.ring svg.rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rg-track{fill:none;stroke:rgba(3,6,20,.7);stroke-width:9}
.ring .rg-fill{fill:none;stroke:url(#rgGrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.ring .badge-t{width:112px;height:112px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));animation:float 4s ease-in-out infinite}
.rk-name{font:900 40px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.rk-name small{font-size:.62em;color:var(--muted);margin-left:8px;letter-spacing:.1em}
.rk-num{display:flex;align-items:baseline;gap:8px;justify-content:center}
.rk-num b{font:900 26px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.delta{font:800 14px/1 var(--display);letter-spacing:.06em;padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.06)}
.delta.up{color:var(--mint)}.delta.down{color:var(--red)}
.season-strip{display:flex;flex-direction:column;gap:8px}
.season-strip .bar{height:6px}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .ax{font:600 10px var(--body);fill:var(--muted)}
.chart .tl{stroke-dasharray:3 4;stroke-width:1}
.chart .tlab{font:800 10px var(--display);letter-spacing:.1em;text-transform:uppercase}
.tip{position:absolute;pointer-events:none;transform:translate(-50%,-100%);padding:7px 9px;border-radius:9px;background:var(--text);color:var(--ink);font:700 12px/1.25 var(--body);white-space:nowrap;box-shadow:0 8px 20px -8px rgba(0,0,0,.6);opacity:0;transition:opacity .12s}
.tip b{font:900 15px/1 var(--display);display:block;font-variant-numeric:tabular-nums}
.tip.on{opacity:1}
.emptychart{display:grid;place-items:center;text-align:center;height:150px;color:var(--muted);font:500 14px/1.45 var(--body);padding:0 20px}

/* tier road */
.road{display:flex;flex-direction:column}
.road-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;position:relative;border-radius:14px}
.road-row .badge-t{width:44px;height:44px}
.road-row.lock{opacity:.5}
.road-row.cur{background:linear-gradient(90deg,rgba(255,204,46,.12),rgba(255,204,46,0));box-shadow:inset 0 0 0 1px rgba(255,204,46,.28)}
.road-row .rr-r{font:800 14px/1.1 var(--display);letter-spacing:.06em;text-align:right;color:var(--gold)}
.road-row .rr-r small{display:block;font:600 11px var(--body);color:var(--muted);letter-spacing:.02em;margin-top:3px}
.road-row .mini-bar{height:4px;border-radius:2px;background:var(--void);margin-top:7px;overflow:hidden}
.road-row .mini-bar i{display:block;height:100%;background:var(--gold);border-radius:2px}
.road-line{position:absolute;left:25px;top:52px;bottom:-10px;width:2px;background:var(--line)}
.road-row:last-child .road-line{display:none}

/* records */
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rec-c{padding:14px;border-radius:16px;background:rgba(3,6,20,.45);box-shadow:inset 0 0 0 1px rgba(43,56,120,.7);display:flex;flex-direction:column;gap:6px}
.rec-c b{font:900 26px/1 var(--display);font-variant-numeric:tabular-nums}
.rec-c span{font:700 10px/1.25 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* shop */
.wallet-chip{display:flex;align-items:center;gap:8px;font:900 28px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.coll{display:flex;align-items:center;gap:10px}
.coll .bar{flex:1;height:6px}
.feat{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center;position:relative;overflow:hidden;cursor:pointer}
.feat::before{content:"";position:absolute;inset:-30%;background:radial-gradient(closest-side at 22% 50%,var(--rc),transparent 70%);opacity:.22;pointer-events:none}
.feat .art{width:132px;height:132px}
.feat-k{display:flex;gap:8px;align-items:center}
.feat-t{font:900 30px/.95 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:6px 0}
.deals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ribbon{position:absolute;top:8px;left:8px;z-index:2;padding:3px 6px;border-radius:6px;background:var(--red);color:#fff;font:900 11px/1 var(--display);letter-spacing:.08em}
.strike{text-decoration:line-through;color:var(--muted);font-size:12px;margin-right:2px}
.item{position:relative;overflow:hidden}
.item.rc-rare,.item.rc-epic,.item.rc-legendary{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 70%,transparent),0 4px 0 #050a1c}
.item.eq{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px var(--gold),0 4px 0 var(--gold-lo)}
.gem{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc);z-index:2}
.holo::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 38%,rgba(255,240,168,.22) 48%,rgba(160,220,255,.18) 54%,transparent 64%);background-size:260% 100%;animation:holo 3.6s linear infinite;pointer-events:none}
@keyframes holo{from{background-position:130% 0}to{background-position:-130% 0}}
.art{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#24307a,#0a1030);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.art .mb{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.art .mb i{position:relative;display:block}
.art .mb svg{position:absolute;inset:6%;width:88%;height:88%}
.art .pp{display:flex;align-items:flex-end;justify-content:center;width:86%;height:70%}
.art .pp svg{height:100%;width:auto;flex:1 1 0;min-width:0}
.art .glyph{font:900 clamp(22px,9cqw,44px)/1 var(--display);color:var(--gold-hi);text-shadow:0 0 16px var(--gold)}
.art{container-type:inline-size}
.art .eqz{display:flex;gap:6%;align-items:flex-end;height:46%;width:56%}
.art .eqz i{flex:1;border-radius:3px;background:linear-gradient(180deg,var(--rc),color-mix(in srgb,var(--rc) 40%,#0a1030));animation:eqz 1s ease-in-out infinite alternate}
.art .eqz i:nth-child(2){animation-delay:-.3s}.art .eqz i:nth-child(3){animation-delay:-.6s}.art .eqz i:nth-child(4){animation-delay:-.15s}
@keyframes eqz{from{height:25%}to{height:100%}}
.art .ttl{padding:6px 8px;border-radius:8px;font:900 clamp(13px,10cqw,30px)/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--rc);text-align:center;text-shadow:0 0 18px color-mix(in srgb,var(--rc) 60%,transparent);border:1.5px solid color-mix(in srgb,var(--rc) 55%,transparent);background:rgba(3,6,20,.5)}
.lockico{position:absolute;left:16px;top:16px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(3,6,20,.75);z-index:2}
.lockico svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2.6}
.shop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* item detail sheet */
.pv{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/10;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#26338a,#070c24);container-type:inline-size}
.pv .pvb{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);height:88%;aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 18px 30px -12px rgba(0,0,0,.7)}
.pv .pvb i{position:relative;display:block}
.pv .pvb svg{position:absolute;inset:6%;width:88%;height:88%}
.pv .pvp{display:flex;align-items:flex-end;gap:2%;height:62%;width:80%}
.pv .pvp svg{flex:1;height:100%;min-width:0}
.pv .fxstage{position:relative;height:84%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);border-radius:10px;overflow:hidden;container-type:inline-size}
.pv .fxstage i{display:block}
.pv .fxstage .pc0{position:absolute;left:33.33%;top:33.33%;width:33.33%;height:33.33%}
.pv .fxstage .pc0 svg{position:absolute;inset:6%;width:88%;height:88%}
.pv .ttlbig{font:900 clamp(26px,11cqw,54px)/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--rc);text-shadow:0 0 30px color-mix(in srgb,var(--rc) 55%,transparent)}
.pv .nameplate{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:rgba(3,6,20,.55);box-shadow:inset 0 0 0 1px var(--line)}
.pv-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 6px}
.pv-name{font:900 28px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.pv-desc{font:500 14px/1.45 var(--body);color:var(--muted);margin:4px 0 16px}
.playbtn{position:absolute;right:12px;bottom:12px;z-index:3}

/* reveal modal */
.reveal{position:relative;width:170px;height:170px;display:grid;place-items:center}
.reveal::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,var(--rc),transparent 30%,var(--rc) 50%,transparent 70%,var(--rc),transparent);opacity:.35;border-radius:50%;animation:spinray 6s linear infinite;filter:blur(6px)}
@keyframes spinray{to{transform:rotate(360deg)}}
.reveal .art{width:150px;height:150px;animation:popin .7s var(--spring) both;box-shadow:0 0 0 3px var(--rc),0 20px 40px -10px rgba(0,0,0,.7)}
@keyframes popin{from{transform:scale(.3) rotate(-12deg);opacity:0}}

/* season pass track */
.pass{position:relative}
.pass .track{gap:0;padding:8px 2px 12px}
.pass .node{width:92px;padding:0 4px;position:relative}
.pass .node::before{content:"";position:absolute;top:30px;left:0;right:0;height:4px;background:var(--void);z-index:0}
.pass .node.reached::before{background:linear-gradient(90deg,var(--gold-lo),var(--gold))}
.pass .lvdot{position:relative;z-index:1;margin:0 auto 6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 14px/1 var(--display);background:var(--void);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.pass .node.reached .lvdot{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1f1600;box-shadow:0 2px 0 var(--gold-lo)}
.pass .node.now .lvdot{box-shadow:0 0 0 4px rgba(255,204,46,.3),0 2px 0 var(--gold-lo);animation:pulse 1.4s ease-in-out infinite}

/* profile card */
.pcard{position:relative;border-radius:26px;padding:3px;background:linear-gradient(140deg,var(--t1),var(--t2) 45%,var(--t1) 70%,var(--t2));background-size:200% 200%;animation:cardsheen 8s ease-in-out infinite;box-shadow:0 24px 50px -20px rgba(0,0,0,.8)}
@keyframes cardsheen{50%{background-position:100% 100%}}
.pcard-in{position:relative;border-radius:23px;padding:18px;overflow:hidden;background:radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--t2) 28%,transparent),transparent 60%),linear-gradient(180deg,#1b2766,#0b1130)}
.pcard-in::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.08) 45%,transparent 55%);background-size:250% 100%;animation:holo 6s linear infinite;pointer-events:none}
.pc-top{display:flex;justify-content:space-between;align-items:center}
.pc-main{display:flex;gap:16px;align-items:center;margin:16px 0}
.pc-name{font:900 30px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-title{font:800 13px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--rc,var(--gold));margin-top:7px}
.pc-rate{display:flex;align-items:center;gap:8px;margin-top:10px}
.pc-rate .badge-t{width:30px;height:30px}
.pc-rate b{font:900 24px/1 var(--display);font-variant-numeric:tabular-nums}
.pc-rate span{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06)}
.pc-stats div{padding:10px 4px;text-align:center;background:rgba(3,6,20,.55)}
.pc-stats b{display:block;font:900 22px/1 var(--display);font-variant-numeric:tabular-nums}
.pc-stats span{display:block;margin-top:5px;font:700 9px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pc-foot{display:flex;justify-content:space-between;margin-top:12px;font:700 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* heatmap */
.heat{display:grid;grid-template-columns:18px repeat(12,minmax(0,1fr));gap:4px;align-items:center}
.heat .hd{font:600 9px/1 var(--body);color:var(--muted)}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.06)}
.heat i.l1{background:rgba(255,204,46,.3)}.heat i.l2{background:rgba(255,204,46,.55)}.heat i.l3{background:rgba(255,204,46,.8)}.heat i.l4{background:#ffcc2e;box-shadow:0 0 8px rgba(255,204,46,.5)}
.heat i.today{box-shadow:inset 0 0 0 1.5px var(--text)}
.heat i.fut{background:transparent}
.heat-leg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font:600 10px var(--body);color:var(--muted);margin-top:10px}
.heat-leg i{width:11px;height:11px;border-radius:3px;display:block}

/* W/D/L bar */
.wdl{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.06)}
.wdl i{display:block;height:100%;transition:flex-grow .8s var(--ease)}
.wdl .w{background:var(--mint)}.wdl .d{background:#7f8ab8}.wdl .l{background:var(--red)}
.wdl-leg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.wdl-leg div{display:flex;flex-direction:column;gap:4px}
.wdl-leg b{font:900 22px/1 var(--display);font-variant-numeric:tabular-nums}
.wdl-leg span{display:flex;align-items:center;gap:6px;font:700 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wdl-leg span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}

/* piece bars */
.pbars{display:flex;flex-direction:column;gap:10px}
.pbar{display:grid;grid-template-columns:26px minmax(0,1fr) 34px;gap:10px;align-items:center}
.pbar svg{width:26px;height:26px}
.pbar .trk{height:10px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
.pbar .trk i{display:block;height:100%;border-radius:0 4px 4px 0;background:#7f95ff;width:0;transition:width .9s var(--ease)}
.pbar b{font:800 16px/1 var(--display);text-align:right;font-variant-numeric:tabular-nums}

/* milestones */
.miles{display:flex;flex-direction:column}
.mile{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:center;padding:11px 0;border-top:1px solid rgba(43,56,120,.6)}
.mile:first-child{border-top:0}
.medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--void);box-shadow:inset 0 0 0 2px var(--line)}
.medal svg{width:28px;height:28px}
.medal.m1{background:radial-gradient(circle at 35% 30%,#ffd9b8,#c27a46);box-shadow:0 3px 0 #7d4622}
.medal.m2{background:radial-gradient(circle at 35% 30%,#ffffff,#a9b4c6);box-shadow:0 3px 0 #6b7486}
.medal.m3{background:radial-gradient(circle at 35% 30%,#fff3b0,#e0a800);box-shadow:0 3px 0 #8a6500,0 0 14px rgba(255,204,46,.45)}
.mile-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mile-top small{font:800 12px/1 var(--display);letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.mile .bar{height:6px;margin-top:8px}
.pips3{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips3 i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pips3 i.on{background:var(--gold)}
.repbtn{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line)}
.repbtn svg{width:14px;height:14px;fill:var(--text)}
.repbtn:focus-visible{outline:2px solid var(--gold-hi)}
.h-row{grid-template-columns:8px minmax(0,1fr) auto auto}
.titles{display:flex;flex-wrap:wrap;gap:8px}
.tchip{all:unset;cursor:pointer;padding:9px 12px;border-radius:11px;font:800 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--rc);background:rgba(3,6,20,.5);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 45%,transparent)}
.tchip[aria-pressed="true"]{background:color-mix(in srgb,var(--rc) 22%,transparent);box-shadow:inset 0 0 0 2px var(--rc)}
.tchip:focus-visible{outline:2px solid var(--gold-hi)}
.promo-badge{width:150px;height:150px;animation:popin .8s var(--spring) both;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.cardimg{width:100%;max-width:300px;border-radius:18px;box-shadow:0 20px 40px -14px rgba(0,0,0,.8)}


/* ================= play (home) page ================= */
.greet{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:-2px}
.greet-t{font:900 26px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase}
.greet-s{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.pillx{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line);font:800 13px/1 var(--display);letter-spacing:.06em;color:var(--text)}
.pillx svg{width:13px;height:13px}
.pillx.hot{color:#ffb35c;box-shadow:inset 0 0 0 1px rgba(255,150,60,.4);background:rgba(255,150,60,.1)}
.icon-btn.help svg{width:20px;height:20px}

.qp{position:relative;overflow:hidden;padding:20px;border-radius:26px;background:radial-gradient(120% 120% at 100% 0%,rgba(127,149,255,.35),transparent 55%),linear-gradient(160deg,#22308a,#0d1440 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px rgba(127,149,255,.35),0 26px 50px -24px rgba(0,0,0,.85)}
.qp-art{position:absolute;right:-4px;top:4px;width:170px;height:170px;pointer-events:none}
.qp-art .k1{position:absolute;right:16px;top:14px;width:112px;height:112px;filter:drop-shadow(0 22px 26px rgba(0,0,0,.55));animation:float 4.5s ease-in-out infinite}
.qp-art .k2{position:absolute;right:120px;top:84px;width:62px;height:62px;opacity:.9;filter:drop-shadow(0 12px 14px rgba(0,0,0,.5));animation:float 4.5s ease-in-out -1.6s infinite}
.qp-art .glow{position:absolute;right:30px;top:40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,204,46,.45),transparent);filter:blur(4px)}
.qp-art .cn{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-hi) 0 18%,var(--gold) 52%,var(--gold-lo));box-shadow:0 2px 0 rgba(0,0,0,.4);animation:float 3.5s ease-in-out infinite}
.qp-k{font:700 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi)}
.qp-t{font:900 40px/.92 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:10px 0 8px;max-width:62%;text-wrap:balance}
.qp-meta{display:flex;gap:6px;flex-wrap:wrap;max-width:64%}
.qp .b3d.go{height:62px;font-size:26px;margin-top:20px;border-radius:18px}
.qp .b3d.go svg{width:24px;height:24px}
.qp-row{display:flex;gap:10px;margin-top:12px}
.qp-row .ghost{flex:1;justify-content:center;height:42px}

.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:13px 12px;border-radius:18px;background:linear-gradient(180deg,#18225a,#0d1438);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(43,56,120,.9),0 4px 0 #050a1c;transition:transform .14s var(--spring),box-shadow .14s}
.act:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(43,56,120,.9),0 1px 0 #050a1c}
.act:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.act .tile-ic{width:36px;height:36px;border-radius:11px}
.act .tile-ic svg{width:19px;height:19px}
.act-t{font:900 16px/1.05 var(--display);letter-spacing:.06em;text-transform:uppercase}
.act-s{font:500 12px/1.25 var(--body);color:var(--muted);margin-top:-6px}

.today{display:flex;flex-direction:column;gap:10px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:20px;background:linear-gradient(180deg,#18225a,#0d1438);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(43,56,120,.9);transition:transform .14s var(--spring)}
.tcard:active{transform:scale(.985)}
.tcard:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.tcard .mini{width:76px;transform:none;box-shadow:0 0 0 2px #1d2766,0 8px 16px -8px rgba(0,0,0,.7);border-radius:9px}
.tcard-k{font:700 10px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi)}
.tcard-t{font:900 21px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:6px 0 5px}
.tcard-s{font:500 12.5px/1.3 var(--body);color:var(--muted)}
.tcard .state{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1f1600;box-shadow:0 3px 0 var(--gold-lo)}
.tcard .state svg{width:20px;height:20px}
.tcard .state.done{background:rgba(75,227,180,.15);color:var(--mint);box-shadow:inset 0 0 0 1.5px rgba(75,227,180,.5)}

.goals .g-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(43,56,120,.6)}
.goals .g-row:first-of-type{border-top:0}
.g-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(3,6,20,.6);box-shadow:inset 0 0 0 1px var(--line)}
.g-ic svg{width:26px;height:26px}
.g-row.done .g-ic{background:rgba(75,227,180,.14);box-shadow:inset 0 0 0 1.5px rgba(75,227,180,.5)}
.g-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.g-top small{font:800 12px/1 var(--display);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.g-row .bar{height:6px;margin-top:8px}
.g-rw{display:inline-flex;align-items:center;gap:4px;font:800 15px/1 var(--display);color:var(--gold)}
.g-rw .crest{width:16px;height:16px}
.g-claim{all:unset;cursor:pointer;padding:9px 12px;border-radius:11px;font:900 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:#062a1f;background:linear-gradient(180deg,#a7f5dc,var(--mint));box-shadow:0 3px 0 #1b7a5c;animation:pulse 1.4s ease-in-out infinite}
.g-claim:focus-visible{outline:2px solid var(--text)}
.g-ok{font:800 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}
.g-bonus{display:flex;align-items:center;gap:12px;margin-top:4px;padding:12px;border-radius:16px;background:linear-gradient(90deg,rgba(255,204,46,.14),rgba(255,204,46,.03));box-shadow:inset 0 0 0 1px rgba(255,204,46,.25)}
.g-bonus .chest{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,var(--gold-hi),var(--gold));box-shadow:0 3px 0 var(--gold-lo)}
.g-bonus .chest svg{width:22px;height:22px;stroke:#2a1f00;fill:none;stroke-width:2.2;stroke-linejoin:round}
.lvline{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lvline .bar{flex:1;height:6px}
.lvline b{font:900 15px/1 var(--display);color:var(--gold);letter-spacing:.06em}

.tipc{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.tipc .tile-ic{width:40px;height:40px}
.tip-k{font:700 10px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tip-t{font:600 14.5px/1.45 var(--body);margin-top:6px}
.joinsheet{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.codebig{all:unset;box-sizing:border-box;width:100%;height:64px;border-radius:16px;background:var(--void);box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;font:900 34px/1 var(--display);letter-spacing:.35em;text-transform:uppercase;color:var(--text);user-select:text;-webkit-user-select:text}
.codebig:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.modeseg{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:row}

.tray.puz .pips,.tray.puz .breakdown,.tray.puz .shop,.tray.puz .bank{display:none}
.opp.puz .next{display:none}
/* ---------- nations ---------- */
.ncrest{flex:none;display:inline-block;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.seat-name .ncrest{margin-left:6px;margin-top:-3px}
.pillx.nat{color:var(--nc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 45%,transparent);background:color-mix(in srgb,var(--nc) 12%,transparent)}
.pillx.nat .ncrest{width:14px;height:15px;filter:none}
.npick{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.wheel-wrap{position:relative;width:min(264px,72vw);aspect-ratio:1;margin:6px auto 2px}
.wheel-wrap::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,#ff6a3d,#2fd3e0,#5bdc7f,#a77bff,#ff6a3d);filter:blur(18px);opacity:.35;animation:spinray 9s linear infinite}
.wheel{position:relative;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 5px #0b1130,0 0 0 8px rgba(255,255,255,.14),0 24px 40px -14px rgba(0,0,0,.8);transition:transform 4.6s cubic-bezier(.12,.75,.12,1)}
.wheel svg{width:100%;height:100%;display:block}
.wheel-pin{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:30px;height:36px;z-index:2;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.wheel-hub{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a3a9a,#0b1130);box-shadow:0 0 0 3px rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.6);display:grid;place-items:center;z-index:1}
.wheel-hub svg{width:56%;height:56%}
.nlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.nlist div{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(3,6,20,.45);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 40%,transparent);font:800 14px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--nc);text-align:left}
.nlist .ncrest{width:20px;height:22px}
.nreveal{display:flex;flex-direction:column;align-items:center;gap:10px}
.nreveal .big{width:96px;height:106px;animation:popin .7s var(--spring) both;filter:drop-shadow(0 0 24px var(--nc))}
.nmotto{font:600 15px/1.35 var(--body);color:var(--muted);font-style:italic}
