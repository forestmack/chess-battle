function renderMe(){
  const st=P.stats,wr=st.games?Math.round(st.wins/Math.max(1,st.wins+st.losses+st.draws)*100):0;
  const sw=(k,label,sub)=>`<div class="set-row"><div><div class="row-t">${label}</div>${sub?`<div class="row-s">${sub}</div>`:''}</div><button class="switch" type="button" role="switch" aria-checked="${!!P.set[k]}" aria-label="${label}" data-act="set" data-k="${k}"><span></span></button></div>`;
  $('scr-me').innerHTML=`<header class="top"><h1 class="h-title">Profile</h1><button class="chip" type="button" data-tab="ranks">${badge(P.rating)}<span>${P.rating}</span></button></header><div class="stagger" style="display:flex;flex-direction:column;gap:14px">
  <div class="panel" style="display:flex;flex-direction:column;gap:14px"><div class="me-head">${avatar(P.av,P.avc,72)}<div style="flex:1;min-width:0"><input class="namein" id="nameIn" maxlength="16" placeholder="${esc(myName())}" value="${esc(P.name)}" aria-label="Your name" autocomplete="off" spellcheck="false"><div class="h-sub" style="margin-top:8px">${TIERS[tierOf(P.rating)][0]} · ${P.ach.length}/${ACH.length} achievements</div></div></div>
    <div class="picker" role="group" aria-label="Avatar piece">${AVP.map(t=>`<button class="pick" type="button" data-act="av" data-v="${t}" aria-pressed="${P.av===t}" aria-label="${NAME[t]}"><svg viewBox="0 0 100 100" style="fill:${AVC[P.avc]};stroke:#060b20;stroke-width:5;--acc:#060b20"><use href="#s-${t}" width="100" height="100"/></svg></button>`).join('')}</div>
    <div class="picker" role="group" aria-label="Avatar color">${Object.keys(AVC).map(c=>`<button class="pick" type="button" data-act="avc" data-v="${c}" aria-pressed="${P.avc===c}" aria-label="${c}"><i style="background:${AVC[c]}"></i></button>`).join('')}</div></div>
  <div class="stats">${[[st.games,'Games'],[st.wins,'Wins'],[wr+'%','Win rate'],[st.best,'Best streak'],[P.daily.streak,'Daily streak'],[st.caps,'Captures'],[st.earned,'Gold earned'],[st.buys,'Pieces bought'],[st.mates,'Checkmates']].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <div class="sec-t">Achievements</div><div class="panel"><div class="achs">${ACH.map(([id,n,d,t])=>`<div class="ach${P.ach.includes(id)?' on':''}" title="${esc(d)}"><i>${svgPiece(t).replace('class="pcs ','class="')}</i><span>${esc(n)}</span></div>`).join('')}</div></div>
  <div class="sec-t">Recent games</div><div class="panel"><div class="hist">${P.hist.length?P.hist.slice(0,10).map(h=>`<div class="h-row"><span class="h-dot ${h.res==='w'?'w':h.res==='l'?'l':''}"></span><div style="min-width:0"><div class="row-t" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(h.label)}</div><div class="row-s">${new Date(h.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${h.turns} turns</div></div><span class="h-d ${h.delta>0?'up':h.delta<0?'down':''}">${h.delta?((h.delta>0?'+':'')+h.delta):'–'}</span></div>`).join(''):'<div class="empty">No games yet. Your results land here.</div>'}</div>
    ${store.get('cb-replay')?'<div class="pair" style="margin-top:10px"><button class="b3d alt sm" type="button" data-act="lastreplay">Watch last game</button></div>':''}</div>
  <div class="sec-t">Settings</div><div class="panel">${sw('sound','Sound','Moves, captures and coins')}${sw('haptics','Haptics','Taps and turn alerts where supported')}${sw('flip','Flip board in pass & play','Turn off when playing across a table')}
    <div class="set-row"><div><div class="row-t">How to play</div></div><button class="ghost" type="button" data-act="intro">Show</button></div>
    <div class="set-row"><div><div class="row-t">${resetArm?'Erase all progress?':'Reset progress'}</div><div class="row-s">${resetArm?'Rating, crowns, cosmetics and stats. This can’t be undone.':'Start over from scratch'}</div></div>${resetArm?'<div class="pair"><button class="ghost" type="button" data-act="noreset">Keep</button><button class="b3d danger sm" type="button" data-act="yesreset">Erase</button></div>':'<button class="ghost" type="button" data-act="reset">Reset</button>'}</div></div>
  <p class="row-s" style="text-align:center">Progress is saved on this device. Accounts and cross-device sync come with the app.</p></div>`;
  const ni=$('nameIn');
  ni.addEventListener('change',()=>{P.name=ni.value.trim().slice(0,16);saveP();pushPlayer();toast('Name saved')});
}

/* ================= intro & sheets ================= */
const INTRO=[
  ['K','How it works','Start small','You get a king, 3 pawns and a knight. So does your opponent.'],
  ['Q','Spoils','Capture = gold','Every piece you take pays out. Pawn 1, knight or bishop 3, rook 5, queen 9.'],
  ['R','Reinforce','Build your army','Spend gold to drop new pieces on your back rows. One piece type at a time, max 8 pawns.'],
  ['N','Careful','No safety net','Moving into check is allowed. Leave your king open when your turn ends and you lose on the spot.'],
];
function showIntro(i){
  const m=$('modal'),[t,k,h,x]=INTRO[i],last=i===INTRO.length-1;
  $('modalCard').innerHTML=`<div class="art">${svgPiece(t).replace('class="pcs ','class="')}</div><div class="result-k">${k}</div><div class="result-t">${h}</div><div class="result-s">${x}</div><div class="dots">${INTRO.map((_,j)=>`<span class="dot${j===i?' on':''}"></span>`).join('')}</div>${last
    ?`<button class="b3d block shine" type="button" data-act="introbot">Play a bot</button><div class="pair"><button class="ghost" type="button" data-act="introinvite">Invite a friend</button><button class="ghost" type="button" data-act="introdaily">Today’s daily</button></div>`
    :`<div class="pair" style="width:100%;flex-wrap:nowrap"><button class="ghost" type="button" data-act="introskip">Skip</button><button class="b3d block" type="button" data-act="intronext" data-i="${i+1}">Next</button></div>`}`;
  m.hidden=false;
}
function endIntro(){P.seen=true;saveP();$('modal').hidden=true}
function openSheet(kind){
  const body=$('sheetBody');
  if(kind==='emotes'){$('sheetTitle').textContent='React';body.innerHTML=`<div class="emotes">${EMOTES.map(e=>`<button class="emote" type="button" data-act="emote" data-e="${e}">${e}</button>`).join('')}</div>`}
  else{
    $('sheetTitle').textContent='Game';
    body.innerHTML=`${S&&!S.over?`<div class="row"><div><div class="row-t">${resignArm?'Resign this game?':'Resign'}</div><div class="row-s">${resignArm?'Counts as a loss.':'Give up the current game'}</div></div>${resignArm?'<div class="pair"><button class="ghost" type="button" data-act="noresign">Keep playing</button><button class="b3d danger sm" type="button" data-act="yesresign">Resign</button></div>':'<button class="ghost" type="button" data-act="resign">Resign</button>'}</div>`:''}
    ${isOnline()?`<div class="row"><div><div class="row-t">Online · ${S.online.code}</div><div class="row-s">You play ${SIDE[S.online.me]}</div></div><div class="pair"><button class="ghost" type="button" data-act="copyinvite">Copy link</button><button class="ghost" type="button" data-act="leaveonline">Leave</button></div></div>`:''}
    ${S&&fixedSide()==null?`<div class="row"><div><div class="row-t">Flip board each turn</div><div class="row-s">Turn off when playing across a table</div></div><button class="switch" type="button" role="switch" aria-checked="${!!S.autoFlip}" aria-label="Flip board each turn" data-act="flip"><span></span></button></div>`:''}
    <details class="fold"><summary>How to play</summary><ul class="rules">
      <li><b>Armies</b><span>King, 3 pawns and a knight each, randomly placed and mirrored.</span></li>
      <li><b>Gold</b><span>Start with 3. No income. Captures pay: pawn 1, knight 3, bishop 3, rook 5, queen 9.</span></li>
      <li><b>Turn</b><span>Move one piece, or buy as many pieces as you can afford, then end your turn.</span></li>
      <li><b>Shop</b><span>Pawn 1, knight 4, bishop 4, rook 6, queen 12. Pawns on your pawn row, others on your back row.</span></li>
      <li><b>Limits</b><span>No buying the same piece twice in a row. Max 8 pawns.</span></li>
      <li><b>Suicide</b><span>End your turn with your king attacked and you lose instantly.</span></li>
      <li><b>Premove</b><span>Against a bot or online, tap or drag your piece while your opponent thinks. It plays the moment your turn starts, if it’s still possible.</span></li>
      <li><b>Victory</b><span>Checkmate, suicide or resignation. No moves and nothing to buy is a draw.</span></li></ul></details>
    <details class="fold"><summary>Move history</summary><ol class="histlist">${S?S.log.map(x=>`<li>${esc(x)}</li>`).join(''):''}</ol></details>`;
  }
  $('sheetWrap').hidden=false;
}
let resignArm=false;
function closeSheet(){$('sheetWrap').hidden=true;resignArm=false}

/* ================= input ================= */
let drag=null;
const vAt=(x,y)=>{const r=boardEl.getBoundingClientRect();const c=Math.floor((x-r.left)/r.width*8),rr=Math.floor((y-r.top)/r.height*8);return inB(rr,c)?rr*8+c:-1};
const clearHover=()=>markEls.forEach(m=>m.classList.remove('hover'));
cellsEl.addEventListener('click',e=>{if(e.detail!==0)return;const c=e.target.closest('.cell');if(c)clickSq(idxAt(+c.dataset.v))});
cellsEl.addEventListener('pointerdown',e=>{
  if(e.button>0||!S)return;ac();
  const c=e.target.closest('.cell');if(!c)return;
  const i=idxAt(+c.dataset.v),p=S.b[i];
  if(canAct()&&!S.buy&&!S.bought&&p&&p.w===S.turn){
    const wasSel=S.sel===i;
    if(!wasSel){S.sel=i;S.tgts=pseudo(S.b,i);renderBoard();vibrate(8);sfx('lift')}
    drag={i,wasSel,x:e.clientX,y:e.clientY,on:false,el:pieceEls.get(p.id),id:e.pointerId,hv:-1};
    try{cellsEl.setPointerCapture(e.pointerId)}catch(_){}
  }else if(canPremove()&&p&&p.w===fixedSide()){
    const wasSel=S.preSel===i;
    if(!wasSel){S.pre=null;S.preSel=i;S.preTgts=premoveTargets(S.b,i);renderBoard();renderTray();vibrate(6);sfx('lift')}
    drag={i,wasSel,pre:true,x:e.clientX,y:e.clientY,on:false,el:pieceEls.get(p.id),id:e.pointerId,hv:-1};
    try{cellsEl.setPointerCapture(e.pointerId)}catch(_){}
  }else drag={i,tap:true,id:e.pointerId};
});
cellsEl.addEventListener('pointermove',e=>{
  if(!drag||drag.tap||e.pointerId!==drag.id)return;
  if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  drag.on=true;const r=boardEl.getBoundingClientRect(),sq=r.width/8,el=drag.el;
  el.classList.add('drag');el.style.transform=`translate(${e.clientX-r.left-sq/2}px,${e.clientY-r.top-sq*.62}px)`;
  const v=vAt(e.clientX,e.clientY),t=v<0?-1:idxAt(v),hv=(drag.pre?S.preTgts:S.tgts).includes(t)&&t!==drag.i?v:-1;
  if(hv!==drag.hv){clearHover();if(hv>=0){markEls[hv].classList.add('hover');vibrate(5)}drag.hv=hv}
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;clearHover();
  if(d.tap){if(!cancel){const v=vAt(e.clientX,e.clientY);if(v>=0&&idxAt(v)===d.i)clickSq(d.i)}return}
  if(!d.on){if(d.wasSel&&!cancel){if(d.pre){clearPreSel();renderTray()}else{S.sel=null;S.tgts=[]}renderBoard()}return}
  const el=d.el;el.classList.remove('drag');el.classList.add('snap');setTimeout(()=>el.classList.remove('snap'),200);
  const v=cancel?-1:vAt(e.clientX,e.clientY),t=v<0?-1:idxAt(v);
  if(d.pre){if(t>=0&&t!==d.i&&S.preTgts.includes(t)&&canPremove()&&S.b[d.i])setPremove(d.i,t);else renderBoard();return}
  if(t>=0&&S.tgts.includes(t))doMove(d.i,t);else{if(t>=0&&t!==d.i)vibrate(4);renderBoard()}
}
cellsEl.addEventListener('pointerup',e=>endDrag(e,false));
cellsEl.addEventListener('pointercancel',e=>endDrag(e,true));
$('rpRange').addEventListener('input',e=>{if(RP){if(RP.timer)rpPlay();rpShow(+e.target.value)}});

document.addEventListener('click',e=>{
  ac();
  if(e.target.id==='sheetWrap'){closeSheet();return}
  const tab=e.target.closest('[data-tab]');if(tab){sfx('tap');go(tab.dataset.tab);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  switch(act){
    case 'buy':clickBuy(a.dataset.t);break;
    case 'cancel':S.buy=null;renderBoard();renderTray();break;
    case 'cancelpre':S.pre=null;clearPreSel();renderBoard();renderTray();break;
    case 'end':if(canAct()&&S.bought){S.buy=null;if(inCheck(S.b,S.turn))suicide(S.turn);else passTurn(false)}break;
    case 'again':startGame(S.mode==='online'?'friend':S.mode);break;
    case 'rematch':rematch();break;
    case 'viewboard':S.resultHidden=true;$('result').hidden=true;break;
    case 'share':copyText(shareText(),'Result copied. Paste it in a text or your story.','shareBox');break;
    case 'replay':enterReplay(S.frames,$('gn').textContent);break;
    case 'lastreplay':{let r=null;try{r=JSON.parse(store.get('cb-replay')||'null')}catch(_){}if(r)enterReplay(r.frames,r.label);break}
    case 'rp-prev':if(RP){if(RP.timer)rpPlay();rpShow(RP.i-1)}break;
    case 'rp-next':if(RP){if(RP.timer)rpPlay();rpShow(RP.i+1)}break;
    case 'rp-play':rpPlay();break;
    case 'rp-exit':exitReplay();break;
    case 'menu':openSheet('game');break;
    case 'emotes':openSheet('emotes');break;
    case 'emote':sendEmote(a.dataset.e);break;
    case 'close':closeSheet();break;
    case 'resign':resignArm=true;openSheet('game');break;
    case 'noresign':resignArm=false;openSheet('game');break;
    case 'yesresign':closeSheet();resign();break;
    case 'flip':S.autoFlip=!S.autoFlip;openSheet('game');if(S.autoFlip&&!busy&&!S.over&&S.view!==S.turn&&fixedSide()==null){busy=true;flipTo(S.turn,()=>{busy=false})}break;
    case 'home':if(RP){const syn=RP.synthetic;exitReplay();if(syn)break}go('home');break;
    case 'resume':go('game');renderAll();if(S.over)showResult();break;
    case 'daily':startGame('daily');break;
    case 'bot':store.set('cb-botpick',botPick);startGame(botPick);break;
    case 'botpick':botPick=a.dataset.m;sfx('tap');a.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===a)));break;
    case 'pass':startGame('friend');break;
    case 'quick':quickMatch();break;
    case 'invite':$('result').hidden=true;hostOnline(false);break;
    case 'join':{const v=$('joinCode').value;joinOnline(v,false)}break;
    case 'copyinvite':copyInvite();break;
    case 'cancelonline':if(gameRef&&!S.online.ready)gameRef.delete().catch(()=>{});leaveOnline();S=null;go('home');break;
    case 'quickbot':if(gameRef)gameRef.delete().catch(()=>{});leaveOnline();startGame(botPick);break;
    case 'leaveonline':closeSheet();leaveOnline();S=null;go('home');break;
    case 'lbtab':lbTab=a.dataset.k;renderRanks();break;
    case 'lb-daily':lbTab='daily';go('ranks');break;
    case 'item':onItem(a.dataset.id);break;
    case 'claim':claim(+a.dataset.l);break;
    case 'av':P.av=a.dataset.v;saveP();pushPlayer();renderMe();break;
    case 'avc':P.avc=a.dataset.v;saveP();pushPlayer();renderMe();break;
    case 'set':P.set[a.dataset.k]=!P.set[a.dataset.k];saveP();a.setAttribute('aria-checked',String(P.set[a.dataset.k]));if(a.dataset.k==='flip'&&S)S.autoFlip=P.set.flip;if(P.set.sound)sfx('tap');break;
    case 'intro':showIntro(0);break;
    case 'intronext':sfx('tap');showIntro(+a.dataset.i);break;
    case 'introskip':endIntro();break;
    case 'introbot':endIntro();botPick='easy';startGame('easy');break;
    case 'introinvite':endIntro();hostOnline(false);break;
    case 'introdaily':endIntro();startGame('daily');break;
    case 'reset':resetArm=true;renderMe();break;
    case 'noreset':resetArm=false;renderMe();break;
    case 'yesreset':resetArm=false;P=DEF_P();P.seen=true;saveP();applyCosmetics();renderMe();toast('Progress reset');break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('sheetWrap').hidden)closeSheet();else if(!$('modal').hidden)endIntro()}});

/* ================= boot ================= */
function start(){
  applyCosmetics();
  const h=(location.hash||'').slice(1).toUpperCase();
  if(h==='DAILY'){P.seen=true;saveP();startGame('daily');return}
  if(/^[A-Z0-9]{6}$/.test(h)){
    P.seen=true;saveP();
    let sv=null;try{sv=JSON.parse(store.get('cb-game')||'null')}catch(e){}
    if(sv&&sv.code===h&&resumeOnline())return;
    joinOnline(h,false);return;
  }
  if(resumeOnline())return;
  go('home',true);
  if(!P.seen)setTimeout(()=>showIntro(0),350);
}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1).toUpperCase();if(/^[A-Z0-9]{6}$/.test(h)&&!(isOnline()&&S.online.code===h))joinOnline(h,false)});
start();
</script>

</html>
