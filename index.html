.nhome{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:150px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px rgba(0,0,0,.3)}
.nhome i{aspect-ratio:1}
.war{background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--nc) 22%,transparent),transparent 60%),linear-gradient(180deg,#18225a,#0b1130)}
.war-top{display:flex;align-items:center;gap:12px}
.war-top .ncrest{width:46px;height:51px}
.war-t{font:900 26px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.war-rows{display:flex;flex-direction:column;gap:10px;margin:16px 0 10px}
.war-row{display:grid;grid-template-columns:22px 26px minmax(0,1fr) auto;gap:10px;align-items:center}
.war-row .pos{font:900 18px/1 var(--display);color:var(--muted);text-align:center}
.war-row .ncrest{width:24px;height:27px}
.war-row .nm{font:800 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--nc)}
.war-row .trk{height:8px;border-radius:4px;background:var(--void);overflow:hidden;margin-top:6px}
.war-row .trk i{display:block;height:100%;border-radius:4px;background:var(--nc);width:0;transition:width .9s var(--ease)}
.war-row .pts{display:flex;align-items:center;gap:4px;font:900 18px/1 var(--display);color:var(--text);font-variant-numeric:tabular-nums}
.war-row .pts .star{width:14px;height:14px}
.war-row.mine{padding:8px;margin:-8px;border-radius:12px;background:color-mix(in srgb,var(--nc) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 35%,transparent)}
.war-me{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.war-me div{padding:10px;border-radius:12px;background:rgba(3,6,20,.45);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.war-me b{display:block;font:900 22px/1 var(--display);color:var(--text)}
.war-me span{font:700 10px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pc-nat{display:flex;align-items:center;gap:8px;font:800 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--nc)}
.pc-nat .ncrest{width:18px;height:20px}
.rw.nat{color:var(--nc)}
.rw .ncrest{width:14px;height:15px;filter:none}
/* ---------- legacy ---------- */
.star{fill:var(--gold);stroke:var(--gold-lo);stroke-width:1.2;stroke-linejoin:round}
.legacy{background:radial-gradient(110% 80% at 0% 0%,rgba(255,122,217,.2),transparent 55%),radial-gradient(110% 80% at 100% 0%,rgba(79,230,255,.17),transparent 55%),linear-gradient(180deg,#1a1f5e,#0b1130);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(160,140,255,.35),0 26px 50px -26px rgba(0,0,0,.85)}
.lg-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.lg-pts{display:flex;align-items:center;gap:8px;margin-top:8px}
.lg-pts b{font:900 44px/.9 var(--display);color:var(--gold);letter-spacing:.02em;text-shadow:0 3px 0 var(--gold-lo)}
.lg-pts .star{width:32px;height:32px;filter:drop-shadow(0 0 10px rgba(255,204,46,.5))}
.lg-rule{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lg-rule span{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;background:rgba(3,6,20,.5);box-shadow:inset 0 0 0 1px var(--line);font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lg-rule b{font:900 14px/1 var(--display);color:var(--text)}
.lg-rule .w b{color:var(--mint)}.lg-rule .l b{color:var(--red)}
.lg-next{display:flex;justify-content:space-between;gap:10px;font:600 13px/1.2 var(--body);color:var(--muted);margin:16px 0 8px}
.lg-next b{color:var(--text)}
.lg-row{display:flex;gap:10px;overflow-x:auto;margin:6px -16px 0;padding:14px 16px 12px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lg-row::-webkit-scrollbar{display:none}
.lgc{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:118px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px 12px;border-radius:18px;position:relative;background:linear-gradient(180deg,#18225a,#0d1438);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 60%,transparent),0 4px 0 #050a1c;transition:transform .14s var(--spring)}
.lgc:active{transform:translateY(3px)}
.lgc.eq{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px var(--gold),0 4px 0 var(--gold-lo)}
.lgc:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.lg-tier{font:800 10px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--rc)}
.lg-art{width:100%;aspect-ratio:1;border-radius:13px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7%;box-sizing:border-box;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc) 32%,#1a2468),#070c24 78%);overflow:hidden;position:relative}
.lg-art svg{width:60%;margin:0 -12%;position:relative}
.lg-art svg+svg{width:50%}
.lgc.locked .lg-art svg{filter:grayscale(.9) brightness(.5)!important}
.lgc.locked .item-n{color:var(--muted)}
.lg-lock{position:absolute;top:28px;right:14px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(3,6,20,.8);z-index:2}
.lg-lock svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2.6}
.lg-need{display:flex;align-items:center;gap:4px;font:800 14px/1 var(--display);letter-spacing:.06em;color:var(--gold)}
.lg-need .star,.rw .star,.pillx .star{width:14px;height:14px}
.lg-mini{width:100%;height:4px;border-radius:2px;background:var(--void);overflow:hidden;margin-top:-2px}
.lg-mini i{display:block;height:100%;background:var(--rc)}
.rw.lg{color:#ffd36b}
.pillx.lg{color:var(--gold)}
.lg-pv{aspect-ratio:auto;padding:22px 14px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 34%,#26338a),#070c24 80%)}
.lg-board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;max-width:380px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px rgba(0,0,0,.3),0 18px 30px -12px rgba(0,0,0,.7)}
.lg-board i{aspect-ratio:1;display:grid;place-items:center}
.lg-board svg{width:88%;height:88%}
.lg-prog{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
.lg-prog .bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 60%,#000),var(--rc))}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0ms!important}
  .pc,.pc-in,.pip,.bar i{transition-duration:1ms!important}
}

  <section class="screen" id="scr-ranks" hidden></section>
  <section class="screen" id="scr-shop" hidden></section>
  <section class="screen" id="scr-me" hidden></section>

  <section class="screen game" id="scr-game" hidden>
    <header class="gtop">
      <button class="icon-btn" type="button" data-act="home" aria-label="Back to home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="glabel"><div class="h-sub" id="gk">Pass &amp; play</div><div class="gname" id="gn">Chess Battle</div></div>
      <div class="gright">
        <button class="icon-btn" type="button" id="emoteBtn" data-act="emotes" aria-label="Send a reaction" hidden><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
        <button class="icon-btn dots" type="button" data-act="menu" aria-label="Game menu"><i></i></button>
      </div>
    </header>
    <section class="opp" id="opp" aria-live="polite"></section>
    <div class="frame">
      <div class="board" id="board">
        <div class="cells" id="cells" role="grid" aria-label="Board"></div>
        <div class="pieces" id="pieces"></div>
        <div class="marks" id="marks"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 800 800" aria-hidden="true"></svg>
        <div class="fx" id="fx"></div>
        <div class="result" id="result" hidden></div>
      </div>
    </div>
    <nav class="mvbar" id="mvbar" aria-label="Moves">
      <button class="mvnav" type="button" id="mvPrev" data-act="hprev" aria-label="Previous move"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="mvlist" id="mvlist"></div>
      <button class="mvnav" type="button" id="mvNext" data-act="hnext" aria-label="Next move"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="mvnav live" type="button" id="mvLive" data-act="hlive" hidden>Live</button>
    </nav>
    <section class="tray" id="tray">
      <div class="tray-head">
        <div class="seat" id="me"></div>
        <span class="clock" id="clkMe" hidden></span>
        <div class="bank"><span class="bank-num" id="goldNum">0</span><span class="bank-lbl">gold</span></div>
      </div>
      <div class="pips" aria-hidden="true"><div class="pips-base" id="pipsBase"></div><div class="pips-x" id="pipsX" hidden></div></div>
      <div class="breakdown" id="breakdown"></div>
      <div class="shop" id="shop"></div>
      <div class="action" id="action"></div>
    </section>
    <section class="replaybar" id="replayBar" hidden>
      <div class="rp-meta"><span id="rpLabel">Replay</span><span id="rpPos">Move 0 / 0</span></div>
      <input type="range" id="rpRange" min="0" max="0" value="0" aria-label="Replay position">
      <div class="rp-ctrl">
        <button class="icon-btn" type="button" data-act="rp-prev" aria-label="Previous move"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="icon-btn big" type="button" data-act="rp-play" id="rpPlay" aria-label="Play replay"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
        <button class="icon-btn" type="button" data-act="rp-next" aria-label="Next move"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="pair"><button class="ghost" type="button" data-act="rp-exit">Exit replay</button><button class="ghost" type="button" disabled>Export clip <span class="tagapp">App</span></button></div>
    </section>
  </section>
</main>

<nav class="tabbar" id="tabbar" aria-label="Main">
  <div class="tabs">
    <span class="tab-ind" id="tabInd"></span>
    <button class="tab" type="button" data-tab="home"><svg viewBox="0 0 24 24"><path d="M5 20h14M7 20l1-6h8l1 6M9 14l-1-6 4 3 4-3-1 6"/><circle cx="12" cy="5" r="1.4"/></svg>Play</button>
    <button class="tab" type="button" data-tab="ranks"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M8.5 12.5l3.5 2 3.5-2M8.5 9.5l3.5 2 3.5-2"/></svg>Ranks</button>
    <button class="tab" type="button" data-tab="shop"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>Shop</button>
    <button class="tab" type="button" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" hidden></div>
<div id="bannerHost"></div>
<canvas id="confetti" hidden></canvas>
<div class="modal-wrap" id="modal" hidden><div class="modal" id="modalCard" role="dialog" aria-modal="true"></div></div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Game menu">
    <div class="grab"></div>
    <div class="sheet-head"><span class="sheet-title" id="sheetTitle">Game</span><button class="ghost" type="button" data-act="close">Done</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

const SHOP=['P','N','B','R','Q'];
const FILES='abcdefgh';
const ARTIFACT_URL='https://claude.ai/artifact/SaJZM1YEUWNHifS4oogSEf';
const $=id=>document.getElementById(id);

const sqName=i=>FILES[i&7]+(8-(i>>3));

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svgPiece=(t,cls='')=>`<svg class="pcs${t==='K'?' pk':''} ${cls}" viewBox="0 0 100 100" aria-hidden="true"><use href="#s-${t}" width="100" height="100"/><use href="#ov-orbit" width="100" height="100" style="display:var(--ovd,none)"/></svg>`;
const crest=(cls='')=>`<span class="crest ${cls}"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#s-Q" width="100" height="100"/></svg></span>`;

const PID=(()=>{let id=store.get('cb-pid');if(!id){id='p'+Math.random().toString(36).slice(2,12);store.set('cb-pid',id)}return id})();

/* ================= profile ================= */

  equip:{board:'b-amethyst',trim:'t-gold',fx:'f-coins',snd:'snd-wood',title:'ti-rookie',set:'classic'},legacy:{pts:0,peak:0,un:['classic'],games:0},nation:null,natGiven:0,war:{month:'',tally:{},mine:0,w:0,l:0,d:0},rh:[],days:{},by:{buy:{},cap:{}},rec:{fast:0,gold:0,caps:0,bestOpp:0},peak:0,since:0,

  return p;
}
let P=loadP();
function initP(){for(const id of ['snd-wood','ti-rookie'])if(!P.owned.includes(id))P.owned.push(id);if(!P.since)P.since=Date.now();if(!Array.isArray(P.rh)||!P.rh.length)P.rh=[{t:Date.now(),r:P.rating}];P.peak=Math.max(P.peak||0,P.rating);if(!P.by||typeof P.by!=='object')P.by={};if(!P.by.buy)P.by.buy={};if(!P.by.cap)P.by.cap={};if(!P.rec)P.rec={fast:0,gold:0,caps:0,bestOpp:0};if(!P.days)P.days={};if(!item(P.equip.board))P.equip.board='b-amethyst';if(!item(P.equip.trim))P.equip.trim='t-gold';if(!item(P.equip.fx))P.equip.fx='f-coins';if(!item(P.equip.snd))P.equip.snd='snd-wood';if(!item(P.equip.title))P.equip.title='ti-rookie';if(!P.legacy||typeof P.legacy!=='object')P.legacy={pts:0,peak:0,un:['classic'],games:0};if(!Array.isArray(P.legacy.un))P.legacy.un=['classic'];if(!P.legacy.un.includes('classic'))P.legacy.un.unshift('classic');P.legacy.pts=Math.max(0,+P.legacy.pts||0);if(!lgSet(P.equip.set)||!P.legacy.un.includes(P.equip.set))P.equip.set='classic';if(P.nation&&!natOf(P.nation))P.nation=null;if(!P.war||typeof P.war!=='object')P.war={month:'',tally:{},mine:0,w:0,l:0,d:0};if(!P.war.tally)P.war.tally={};P.natGiven=+P.natGiven||0}
const saveP=()=>store.set('cb-profile',JSON.stringify(P));
const myName=()=>P.name||('Player '+PID.slice(-4).toUpperCase());
const AVC={gold:'#ffcc2e',mint:'#4be3b4',rose:'#f08a9a',sky:'#6fb6ff',lilac:'#7f95ff',ivory:'#fcf8ef'};
const AVP=['K','Q','R','B','N','P'];
function avatar(av,avc,sz){const c=AVC[avc]||AVC.gold,t=AVP.includes(av)?av:'Q';
  return `<span class="avt" style="width:${sz}px;height:${sz}px;--c:${c}"><svg viewBox="0 0 100 100" aria-hidden="true" style="fill:${c};stroke:#060b20;stroke-width:5;stroke-linejoin:round;--acc:#060b20"><use href="#s-${t}" width="100" height="100"/></svg></span>`}

/* tiers */
const TIERS=[['Bronze',0,'#efb98c','#8a5530'],['Silver',800,'#eef2f7','#8d97a8'],['Gold',1000,'#fff0b0','#c98a0c'],['Platinum',1200,'#d4fbf2','#3f9f92'],['Diamond',1400,'#dbeaff','#4a78dc'],['Master',1600,'#f0dcff','#8a48d2'],['Grandmaster',1800,'#ffd0d0','#cf3553']];

function badge(r,cls='',forceTier){

}
const elo=(r,o,s)=>Math.round(32*(s-1/(1+Math.pow(10,(o-r)/400))));

/* cosmetics */
const ITEMS=[
  {id:'b-amethyst',kind:'board',name:'Cobalt',price:0,rarity:'common',l:'#e4e9ff',d:'#4f67d8',desc:'The house board. Electric blue, made for battle.'},

  {id:'b-obsidian',kind:'board',name:'Obsidian',price:500,rarity:'epic',l:'#8a8d9c',d:'#3d3f4c',desc:'Volcanic glass in two shades of night.'},
  {id:'b-aurora',kind:'board',name:'Aurora',price:900,rarity:'legendary',l:'linear-gradient(135deg,#eef0ff,#dcf6ff)',d:'linear-gradient(135deg,#5468ee,#9a5be0)',desc:'Every dark square glows from cobalt to violet, like the northern lights.'},
  {id:'b-gilded',kind:'board',name:'Gilded',pass:10,rarity:'legendary',l:'#f6e7bb',d:'#b98a2c',desc:'Season 1 exclusive. Gold leaf on ivory.'},

];
const natOf=id=>NATIONS.find(n=>n.id===id)||null;
const myNat=()=>natOf(P.nation);
function crestN(n,cls=''){if(!n)return '';return `<svg class="ncrest ${cls}" width="20" height="22" viewBox="0 0 40 44" aria-label="${esc(n.name)}" role="img"><path d="M20 2 L37 8 V22 C37 33 29 39 20 42 C11 39 3 33 3 22 V8 Z" fill="${n.c}" stroke="rgba(255,255,255,.75)" stroke-width="2.2" stroke-linejoin="round"/><path d="M20 6 L33 10.5 V22 C33 30.5 27 35.5 20 38" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/><g transform="translate(8.5 9.5) scale(.96)" fill="#fff"><path d="${n.g}"/></g></svg>`}

initP();
const PASS={2:{crowns:50},4:{crowns:75},6:{item:'t-emerald'},8:{crowns:100},10:{item:'b-gilded'},12:{crowns:125},14:{item:'f-shock'},16:{crowns:150},18:{item:'ti-gilded'},20:{crowns:300}};

const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];

function attacks(b,i){
  const p=b[i],r=i>>3,c=i&7,out=[];
  if(p.t==='P'){const dr=p.w?-1:1;for(const dc of[-1,1])if(inB(r+dr,c+dc))out.push((r+dr)*8+c+dc);return out}
  const step=(dirs,slide)=>{for(const[dr,dc]of dirs){let rr=r+dr,cc=c+dc;while(inB(rr,cc)){out.push(rr*8+cc);if(!slide||b[rr*8+cc])break;rr+=dr;cc+=dc}}};
  if(p.t==='N')step(KN,false);
  if(p.t==='K')step(DIAG.concat(ORTH),false);
  if(p.t==='B')step(DIAG,true);
  if(p.t==='R')step(ORTH,true);
  if(p.t==='Q')step(DIAG.concat(ORTH),true);
  return out;
}
function pseudo(b,i){
  const p=b[i];

    return out;
  }

}

let deadline=Infinity;const MATE=1e6;
function evalW(st){
  let s=0;const b=st.b;
  for(let i=0;i<64;i++){const p=b[i];if(!p)continue;const r=i>>3,c=i&7;let v=0;
    if(p.t!=='K')v=VAL[p.t]*100;
    if(p.t==='P')v+=(p.w?6-r:r-1)*12;
    else if(p.t==='N'||p.t==='B')v+=14-(Math.abs(c-3.5)+Math.abs(r-3.5))*4;
    else if(p.t==='Q'||p.t==='R')v+=6-Math.abs(c-3.5)*2;
    s+=p.w?v:-v}
  return s+(st.g[1]-st.g[0])*45;
}
function genActs(st,w,capsOnly){
  const b=st.b,acts=[];
  for(let i=0;i<64;i++){const p=b[i];if(!p||p.w!==w)continue;
    for(const t of pseudo(b,i)){const cap=b[t];if(capsOnly&&!cap)continue;
      const nb=apply(b,i,t);if(inCheck(nb,w))continue;
      acts.push({type:'move',from:i,to:t,cap:cap?VAL[cap.t]:0,nb,ord:cap?VAL[cap.t]*10-VAL[p.t]+100:(nb[t].t!==p.t?90:0)})}}
  if(capsOnly)return acts;
  const chk=inCheck(b,w),pawns=pawnCount(b,w);
  for(const t of SHOP){
    if(st.lb[w]===t||st.g[w]<PRICE[t]||(t==='P'&&pawns>=8))continue;
    const sqs=placeSquares(b,w,t).sort((x,y)=>Math.abs((x&7)-3.5)-Math.abs((y&7)-3.5));
    let n=0;for(const sq of sqs){if(n>=2)break;
      if(chk){const nb=b.slice();nb[sq]={t,w};if(inCheck(nb,w))continue}
      acts.push({type:'buy',t,sq,ord:10+PRICE[t]});n++}}
  return acts.sort((a,b)=>b.ord-a.ord);
}
function applyAct(st,a,w){
  const g=st.g.slice();
  if(a.type==='move'){if(a.cap)g[w]+=a.cap;return {b:a.nb,g,lb:st.lb}}
  const nb=st.b.slice();nb[a.sq]={t:a.t,w};g[w]-=PRICE[a.t];const lb=st.lb.slice();lb[w]=a.t;
  return {b:nb,g,lb};
}
function quiesce(st,w,alpha,beta,qd){
  const stand=(w?1:-1)*evalW(st);
  if(qd===0||stand>=beta)return stand;
  if(stand>alpha)alpha=stand;
  for(const a of genActs(st,w,true)){const v=-quiesce(applyAct(st,a,w),1-w,-beta,-alpha,qd-1);if(v>=beta)return v;if(v>alpha)alpha=v}
  return alpha;
}
function negamax(st,w,d,alpha,beta,ply,qd){
  if(performance.now()>deadline)throw 'time';
  if(d===0)return quiesce(st,w,alpha,beta,qd);
  const acts=genActs(st,w,false);
  if(!acts.length){const any=st.b.some((p,i)=>p&&p.w===w&&pseudo(st.b,i).length);return (inCheck(st.b,w)||any)?-MATE+ply:0}
  let best=-Infinity;
  for(const a of acts){const v=-negamax(applyAct(st,a,w),1-w,d-1,-beta,-alpha,ply+1,qd);if(v>best)best=v;if(v>alpha)alpha=v;if(alpha>=beta)break}
  return best;
}
function chooseBot(mode,st){
  const w=BOT;
  let acts=genActs(st,w,false);
  if(!acts.length){for(let i=0;i<64;i++){const p=st.b[i];if(p&&p.w===w){const m=pseudo(st.b,i);if(m.length)return [{type:'move',from:i,to:m[0]}]}}return null}
  const cfg={easy:{d:1,qd:0,noise:140,rnd:.3},medium:{d:2,qd:2,noise:18,rnd:0},hard:{d:4,qd:4,noise:0,rnd:0,ms:1300}}[mode==='daily'?'medium':mode];
  if(Math.random()<cfg.rnd)return [acts[rand(acts.length)]];
  let best=acts[0];
  const search=d=>{let bv=-Infinity,ba=null,alpha=-Infinity;const scored=[];
    for(const a of acts){const v=-negamax(applyAct(st,a,w),1-w,d-1,-Infinity,-alpha,1,cfg.qd)+(Math.random()-.5)*cfg.noise;scored.push([v,a]);if(v>bv){bv=v;ba=a}if(v>alpha)alpha=v}
    scored.sort((x,y)=>y[0]-x[0]);acts=scored.map(x=>x[1]);return ba};
  deadline=cfg.ms?performance.now()+cfg.ms:Infinity;
  try{if(cfg.ms){for(let d=1;d<=cfg.d;d++)best=search(d)}else best=search(cfg.d)}catch(e){if(e!=='time')throw e}
  deadline=Infinity;
  const plan=[best];
  if(best.type==='buy'&&mode!=='easy'){
    let cur=applyAct(st,best,w);
    for(let k=0;k<4;k++){
      const stop=-negamax(cur,1-w,1,-Infinity,Infinity,1,2);let bv=stop,ba=null;
      for(const a of genActs(cur,w,false)){if(a.type!=='buy')continue;const v=-negamax(applyAct(cur,a,w),1-w,1,-Infinity,Infinity,1,2);if(v>bv+10){bv=v;ba=a}}
      if(!ba)break;plan.push(ba);cur=applyAct(cur,ba,w)}
  }
  return plan.map(a=>({type:a.type,from:a.from,to:a.to,t:a.t,sq:a.sq}));
}
/* bot search runs in a worker so the UI never freezes */
let botWorker=null,botReq=0;
function getWorker(){
  if(botWorker===false)return null;
  if(botWorker)return botWorker;
  try{
    const src=[`const BOT=${BOT},MATE=${MATE};let deadline=Infinity;`,
      `const KN=${JSON.stringify(KN)},DIAG=${JSON.stringify(DIAG)},ORTH=${JSON.stringify(ORTH)},VAL=${JSON.stringify(VAL)},PRICE=${JSON.stringify(PRICE)},SHOP=${JSON.stringify(SHOP)};`,
      `const inB=${inB.toString()};const rand=${rand.toString()};const kingIdx=${kingIdx.toString()};const pawnCount=${pawnCount.toString()};`,
      ...[attacks,pseudo,apply,inCheck,placeSquares,evalW,genActs,applyAct,quiesce,negamax,chooseBot].map(f=>f.toString()),
      `onmessage=e=>{let plan=null;try{plan=chooseBot(e.data.mode,e.data.st)}catch(err){}postMessage({id:e.data.id,plan})};`].join('\n');
    botWorker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  }catch(e){botWorker=false}
  return botWorker||null;
}
function thinkBot(mode,st,cb){
  const w=getWorker(),id=++botReq;
  if(!w){setTimeout(()=>cb(chooseBot(mode,st)),0);return}
  let done=false;
  const fallback=()=>{if(done)return;done=true;botWorker=false;cb(chooseBot(mode,st))};
  w.onmessage=e=>{if(e.data.id!==id||done)return;done=true;cb(e.data.plan)};
  w.onerror=fallback;
  try{w.postMessage({mode,st:JSON.parse(JSON.stringify(st)),id})}catch(e){fallback()}
}
function botTurn(){

    if(!S||S.gid!==gid||S.over)return;
    if(!plan){busy=false;return}
    if(plan[0].type==='move'){setTimeout(()=>{if(S.gid!==gid)return;busy=false;doMove(plan[0].from,plan[0].to)},200);return}
    let k=0;

      if(S.gid!==gid)return;
      if(k<plan.length){const a=plan[k++];
        S.b[a.sq]={t:a.t,w:BOT,id:S.nid++};S.gold[BOT]-=PRICE[a.t];S.lastBuy[BOT]=a.t;S.last=[a.sq];STAT(BOT).buys++;S.prog=true;
        S.log.push(`${SIDE[BOT]} buys a ${NAME[a.t]} on ${sqName(a.sq)}`);sfx('buy');if(!S.tm)S.tm=[];S.tm.push(`${a.t}@${sqName(a.sq)}`);
        renderBoard();renderOpp();setTimeout(step,420);return}

function peerReady(id){
  return new Promise((res,rej)=>{
    if(!window.Peer){rej({type:'nolib'});return}
    let tries=0;

      tries++;const p=id?new Peer(id,{debug:0}):new Peer({debug:0});
      const t=setTimeout(()=>{try{p.destroy()}catch(e){}rej({type:'timeout'})},15000);

/* ---------- daily puzzle: checkmate in one ---------- */
const isMateFor=(b,w)=>inCheck(b,w)&&!anyLegal(b,w);
function genPuzzle(n){
  const R=seeded(n*31+7),ri=k=>Math.floor(R()*k);
  for(let tries=0;tries<9000;tries++){
    const b=Array(64).fill(null),put=(t,w,lo,hi)=>{for(let g=0;g<40;g++){const i=(lo+ri(hi-lo+1))*8+ri(8);if(!b[i]){b[i]={t,w};return i}}return -1};
    const bk=put('K',0,0,1),wk=put('K',1,4,7);if(bk<0||wk<0)continue;
    if(Math.abs((bk>>3)-(wk>>3))<=1&&Math.abs((bk&7)-(wk&7))<=1)continue;
    const wp=['Q','R','R','B','N','N','B','Q'],bp=['P','P','P','N','B','R'];
    const nw=2+ri(2),nb=1+ri(3);let bad=false;
    for(let k=0;k<nw;k++)if(put(wp[ri(wp.length)],1,1,6)<0)bad=true;
    for(let k=0;k<nb;k++){const t=bp[ri(bp.length)];if(put(t,0,t==='P'?1:0,t==='P'?2:2)<0)bad=true}
    if(bad||inCheck(b,0)||inCheck(b,1))continue;
    if(b.some((p,i)=>p&&p.t==='P'&&((p.w&&i<8)||(!p.w&&i>=56))))continue;
    const sols=[];
    for(let i=0;i<64&&sols.length<2;i++){const p=b[i];if(!p||!p.w)continue;for(const t of pseudo(b,i)){const nb2=apply(b,i,t);if(inCheck(nb2,1))continue;if(isMateFor(nb2,0)){sols.push([i,t]);if(sols.length>1)break}}}
    if(sols.length!==1)continue;
    let id=1;b.forEach(p=>{if(p)p.id=id++});
    return {b,sol:sols[0],nid:id};
  }
  return null;
}
function getPuzzle(){
  const n=dailyNo(),k='cb-puz-'+n;let pz=null;
  try{pz=JSON.parse(store.get(k)||'null')}catch(e){}
  if(!pz){pz=genPuzzle(n);if(pz)store.set(k,JSON.stringify(pz))}
  return pz;
}
const puzzleDone=()=>!!(P.puz&&P.puz.days&&P.puz.days[dailyNo()]);
function startPuzzle(){
  const pz=getPuzzle();if(!pz){toast('Today’s puzzle isn’t ready. Try again in a moment.');return}
  if(isOnline())leaveOnline();
  newGame('puzzle');S.b=pz.b.map(p=>p?{...p}:null);S.nid=pz.nid;S.gold=[0,0];S.chk=false;S.note='';S.last=[];
  S.frames=[{b:S.b.slice(),last:[]}];S.puz={sol:pz.sol,tries:0,start:pz.b,hint:false};S.dailyNo=dailyNo();S.log=[`Daily puzzle #${dailyNo()}. White to move and checkmate.`];S.autoFlip=false;
  HV=null;busy=false;resetDom();go('game');renderAll({stagger:true});sfx('start');
}
function puzzleTry(from,to,b0){
  const ok=isMateFor(S.b,0)&&!inCheck(S.b,1);
  if(ok){
    pushMoveLabel();S.moves[S.moves.length-1]=S.moves[S.moves.length-1].replace(/\+?$/,'#');$('toast').hidden=true;S.frames.push({b:S.b.slice(),last:S.last.slice()});S.over={win:1,why:'Solved'};S.puz.tries++;busy=true;
    renderAll();sfx('check');vibrate(30);

  }

  setTimeout(()=>{sfx('illegal');toast(S.puz.tries>=2?'Not checkmate. Tap Hint or Answer if you’re stuck.':'Not checkmate. Try again.');
    S.b=S.puz.start.map(p=>p?{...p}:null);S.last=[];S.tm=[];busy=false;renderBoard();renderTray()},520);
}

  S.log.push(`${SIDE[w]} left their king in check. ${SIDE[1-w]} wins.`);S.frames.push({b:S.b.slice(),last:S.last.slice()});

}
function resign(){

  freezeClock();S.over={win:1-me,why:'Resignation'};S.log.push(`${SIDE[me]} resigned.`);busy=false;
  push();renderAll();showResult();
}
function passTurn(captured){
  busy=true;const gid=S.gid;
  S.quiet=S.prog?0:(S.quiet||0)+1;S.prog=false;
  closeTurnClock();pushMoveLabel();HV=null;
  S.turn=1-S.turn;beginTurn();if(S.over&&S.over.why==='Checkmate'&&S.moves.length)S.moves[S.moves.length-1]=S.moves[S.moves.length-1].replace(/\+?$/,'#');
  if(S.clock&&!S.over&&clockLive())S.clockT=performance.now();S.frames.push({b:S.b.slice(),last:S.last.slice()});snapHuman();push();
  renderBoard();$('tray').classList.add('locked');
  setTimeout(()=>{
    if(!S||S.gid!==gid)return;
    const free=fixedSide()==null,flip=!S.over&&free&&S.autoFlip&&S.view!==S.turn;
    renderOpp({swap:free});renderTray({swap:!S.over&&free});
    if(!S.over&&S.chk&&isLocalHuman(S.turn))sfx('check');
    const done=()=>{if(S.gid!==gid)return;busy=false;if(S.over)showResult();else if(isBotTurn())botTurn();else if(S.pre)runPremove();else if(S.preSel!=null){clearPreSel();renderBoard()}};

  },captured?560:300);

function clickSq(i){
  if(canPremove()){premoveClick(i);return}
  if(!canAct())return;
  const w=S.turn;
  if(S.buy){
    if(placeSquares(S.b,w,S.buy).includes(i))placeBuy(S.buy,i);else S.buy=null;
    renderBoard();renderTray();return;
  }
  if(S.bought)return;
  const p=S.b[i];
  if(S.sel!=null&&S.tgts.includes(i)){doMove(S.sel,i);return}
  if(p&&p.w===w&&S.sel!==i){S.sel=i;S.tgts=pseudo(S.b,i);vibrate(8);sfx('lift')}else{S.sel=null;S.tgts=[]}
  renderBoard();
}
function placeBuy(t,i){
  const w=S.turn;S.b[i]={t,w,id:S.nid++};S.gold[w]-=PRICE[t];S.bought=true;S.prog=true;S.last=[i];S.lastBuy[w]=t;STAT(w).buys++;
  S.log.push(`${SIDE[w]} buys a ${NAME[t]} on ${sqName(i)}`);S.buy=null;vibrate(12);sfx('buy');if(!S.tm)S.tm=[];S.tm.push(`${t}@${sqName(i)}`);HV=null;clearArrows();
  if(isLocalHuman(w)){P.stats.buys++;P.by.buy[t]=(P.by.buy[t]||0)+1;questEvent('buy',1,{t});questEvent('spend',PRICE[t]);if(t==='Q')unlock('queen');if(pawnCount(S.b,w)>=8)unlock('pawns');saveP()}
}
function sanOf(b0,from,to,b1){
  const p=b0[from],cap=b0[to];let s='';
  if(p.t==='P')s=(cap?FILES[from&7]+'x':'')+sqName(to);
  else{
    const rivals=[];for(let k=0;k<64;k++){const q=b0[k];if(k!==from&&q&&q.w===p.w&&q.t===p.t&&pseudo(b0,k).includes(to))rivals.push(k)}
    let d='';if(rivals.length){d=rivals.some(k=>(k&7)===(from&7))?(rivals.some(k=>(k>>3)===(from>>3))?sqName(from):String(8-(from>>3))):FILES[from&7]}
    s=p.t+d+(cap?'x':'')+sqName(to);
  }
  if(b1[to]&&b1[to].t!==p.t)s+='=Q';
  if(inCheck(b1,1-p.w))s+='+';
  return s;
}
function doMove(from,i){
  const w=S.turn,mover=S.b[from],cap=S.b[i],b0=S.b;
  S.b=apply(S.b,from,i);if(!S.tm)S.tm=[];S.tm.push(sanOf(b0,from,i,S.b));HV=null;S.last=[from,i];S.sel=null;S.tgts=[];
  if(S.mode==='puzzle'){sfx(cap?'cap':'move');puzzleTry(from,i,b0);return}

const encFrame=f=>f.b.map(p=>p?(p.w?p.t:p.t.toLowerCase()):'.').join('')+'|'+(f.last||[]).join(',');
function decFrames(list){
  let prev=null,nid=1;const out=[];
  for(const s of list){
    const [bs,ls]=String(s).split('|'),b=Array(64).fill(null);
    for(let i=0;i<64;i++){const ch=bs[i];if(ch&&ch!=='.')b[i]={t:ch.toUpperCase(),w:ch===ch.toUpperCase()?1:0,id:0}}
    if(prev){
      const gone=[];
      for(let i=0;i<64;i++){const a=prev[i],c=b[i];if(a&&c&&a.t===c.t&&a.w===c.w)c.id=a.id;else if(a)gone.push(a)}
      for(let i=0;i<64;i++){const c=b[i];if(!c||c.id)continue;
        let k=gone.findIndex(g=>g.w===c.w&&g.t===c.t);if(k<0)k=gone.findIndex(g=>g.w===c.w&&g.t==='P'&&c.t==='Q');
        if(k>=0){c.id=gone[k].id;gone.splice(k,1)}else c.id=nid++}
    }else for(let i=0;i<64;i++)if(b[i])b[i].id=nid++;
    nid=Math.max(nid,...b.filter(Boolean).map(p=>p.id+1));
    out.push({b,last:ls?ls.split(',').filter(x=>x!=='').map(Number):[]});prev=b;
  }
  return out;
}

const dayKey=d=>{d=new Date(d);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
function trackGame(info){
  const now=info.t;
  P.days[dayKey(now)]=(P.days[dayKey(now)]||0)+1;
  const ks=Object.keys(P.days);if(ks.length>150){ks.sort((a,b)=>new Date(a)-new Date(b)).slice(0,ks.length-150).forEach(k=>delete P.days[k])}
  if(info.rated){P.rh.push({t:now,r:P.rating});if(P.rh.length>300)P.rh=P.rh.slice(-300)}
  P.peak=Math.max(P.peak||0,P.rating);
  if(info.me!=null){
    const st=S.stats[info.me];
    if(info.won){P.rec.fast=P.rec.fast?Math.min(P.rec.fast,info.turns):info.turns;if(info.opp)P.rec.bestOpp=Math.max(P.rec.bestOpp||0,info.opp)}
    P.rec.gold=Math.max(P.rec.gold||0,st.earned||0);P.rec.caps=Math.max(P.rec.caps||0,st.caps||0);
  }
}
function divOf(r){
  const t=tierOf(r);if(t===TIERS.length-1)return '';
  const lo=Math.max(TIERS[t][1],t===0?500:0),hi=TIERS[t+1][1],third=(hi-lo)/3;
  return r>=lo+2*third?'I':r>=lo+third?'II':'III';
}
function tierProgress(r){const t=tierOf(r),next=TIERS[t+1];if(!next)return 1;const lo=t===0?Math.min(r,500):TIERS[t][1];return Math.max(0,Math.min(1,(r-lo)/(next[1]-lo)))}

    for(let c=0;c<12;c++){const d=new Date(start);d.setDate(start.getDate()+c*7+r);const fut=d>today,n=P.days[dayKey(d)]||0;if(!fut){total+=n;if(n)active++}

function dragTo(e){

  if(!d.on&&!d.mouse&&!d.moved)return;
  if(!d.on){d.on=true;boardEl.classList.add('dragging');document.body.classList.add('dragging')}
  const r=boardEl.getBoundingClientRect(),sq=r.width/8,el=d.el;
  el.classList.add('drag');el.style.transitionDelay='0ms';el.style.transform=`translate(${e.clientX-r.left-sq/2}px,${e.clientY-r.top-sq*(d.mouse?.5:.66)}px)`;

  if(!d.on||!d.moved){if(d.on){d.el.classList.remove('drag');d.el.classList.add('snap');setTimeout(()=>d.el.classList.remove('snap'),200)}if(d.wasSel&&!cancel){if(d.pre){clearPreSel();renderTray()}else{S.sel=null;S.tgts=[]}}renderBoard();return}

    case 'setupgo':{const k=setupKind;P.set.last={kind:k,level:botPick};saveP();closeSheet();if(k==='bot')startGame(botPick,P.set.tc);else if(k==='pass')startGame('friend',P.set.tc);else hostOnline(P.set.tc);break}
    case 'mkpick':setupKind=a.dataset.k;sfx('tap');openSetup(setupKind);break;
    case 'lvpick':botPick=a.dataset.m;store.set('cb-botpick',botPick);sfx('tap');openSetup(setupKind);break;
    case 'quick':startQuick();break;
    case 'pickmode':openSetup(lastMode().kind);break;
    case 'openjoin':openJoin();break;
    case 'puzzle':startPuzzle();break;
    case 'phint':puzzleHint();break;
    case 'panswer':puzzleAnswer();break;
    case 'qclaim':claimGoal(a.dataset.id);break;
    case 'qbonus':claimBonus();break;
    case 'nexttip':tipOff++;{const el=$('tipT');if(el)el.textContent=tipNow()}sfx('tap');break;
    case 'sharepuz':shareOut(`Chess Battle daily puzzle #${dailyNo()} ✅ ${S&&S.puz&&S.puz.tries===1?'first try':'solved in '+pl(S.puz.tries,'try')}. Can you find mate in 1?`,SITE_URL,'Copied. Paste it anywhere.','shareBox');break;
    case 'hist':setHV(+a.dataset.i);break;
    case 'hprev':setHV((HV==null?histMax():HV)-1);break;
    case 'hnext':if(HV!=null)setHV(HV+1);break;
    case 'hlive':setHV(null);break;
    case 'join':{const v=$('joinCode').value;closeSheet();joinOnline(v,false)}break;
    case 'copyinvite':copyInvite();break;
    case 'cancelonline':leaveOnline();S=null;go('home');break;
    case 'leaveonline':closeSheet();leaveOnline();S=null;go('home');break;
    case 'botgo':botPick=a.dataset.m;store.set('cb-botpick',botPick);startGame(botPick);break;
    case 'item':openItem(a.dataset.id);break;
    case 'buyitem':buyItem(a.dataset.id);break;
    case 'equip':equipItem(a.dataset.id);break;
    case 'pvfx':pvFx();break;
    case 'pvsnd':previewSound(openItemId);break;
    case 'stab':shopTab=a.dataset.k;sfx('tap');renderShop();break;
    case 'lgitem':openLegacy(a.dataset.id);break;
    case 'npick':showNationPick();break;
    case 'nspin':spinNation();break;
    case 'ncard':showNationCard(P.nation);break;
    case 'lgequip':equipLegacy(a.dataset.id);break;
    case 'crange':chartRange=a.dataset.k;renderRanks();break;
    case 'pbtab':pbarTab=a.dataset.k;renderMe();break;
    case 'edit':openEdit();break;
    case 'tosettings':$('settingsSec').scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'settitle':P.equip.title=a.dataset.id;saveP();sfx('tap');openEdit();renderMe();break;
    case 'sharecard':shareCard();break;
    case 'closemodal':$('modal').hidden=true;break;
    case 'rep':{if(S&&!S.over&&S.mode!=='puzzle'){toast('Finish your current game first. Tap Resume on Play.');break}if(S&&(S.over||S.mode==='puzzle'))S=null;const r=loadReps().find(x=>x.t===+a.dataset.t);if(r)enterReplay(decFrames(r.f),r.label);break}
    case 'claim':claim(+a.dataset.l);break;
    case 'av':P.av=a.dataset.v;saveP();renderMe();if(!$('sheetWrap').hidden)openEdit();break;
    case 'avc':P.avc=a.dataset.v;saveP();renderMe();if(!$('sheetWrap').hidden)openEdit();break;
    case 'set':P.set[a.dataset.k]=!P.set[a.dataset.k];saveP();a.setAttribute('aria-checked',String(P.set[a.dataset.k]));if(a.dataset.k==='flip'&&S)S.autoFlip=P.set.flip;if(P.set.sound)sfx('tap');break;
    case 'intro':showIntro(0);break;
    case 'intronext':sfx('tap');showIntro(+a.dataset.i);break;
    case 'introskip':endIntro();break;
    case 'introbot':endIntro();botPick='easy';startGame('easy');break;
    case 'introinvite':endIntro();openSetup('invite');break;
    case 'introdaily':endIntro();startGame('daily');break;
    case 'reset':resetArm=true;renderMe();break;
    case 'noreset':resetArm=false;renderMe();break;
    case 'yesreset':{resetArm=false;try{Object.keys(localStorage).filter(k=>/^cb-(daily-|reps|replay|online-state|game)/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}P=DEF_P();initP();P.seen=true;saveP();applyCosmetics();renderMe();toast('Progress reset');break}
  }
});
document.addEventListener('keydown',e=>{
  if(route==='game'&&S&&!RP&&$('sheetWrap').hidden&&!/INPUT|TEXTAREA/.test((e.target&&e.target.tagName)||'')){
    if(e.key==='ArrowLeft'){e.preventDefault();setHV((HV==null?histMax():HV)-1);return}
    if(e.key==='ArrowRight'){e.preventDefault();if(HV!=null)setHV(HV+1);return}
    if(e.key==='Escape'&&HV!=null){setHV(null);return}
  }if(e.key==='Escape'){if(!$('sheetWrap').hidden)closeSheet();else if(!$('modal').hidden)endIntro()}});

/* ================= boot ================= */
function start(){
  applyCosmetics();
  const h=(location.hash||'').slice(1).toUpperCase();
  if(h==='DAILY'){P.seen=true;saveP();startGame('daily');return}
  if(/^[A-Z0-9]{6}$/.test(h)){
    P.seen=true;saveP();
    let sv=null;try{sv=JSON.parse(store.get('cb-game')||'null')}catch(e){}
    if(sv&&sv.code===h&&resumeOnline())return;
    joinOnline(h,false);return;
  }
  if(resumeOnline())return;
  go('home',true);
  if(!P.seen)setTimeout(()=>showIntro(0),350);
  else if(!P.nation)setTimeout(()=>{if(route==='home'&&$('modal').hidden)showNationPick()},600);
}
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1).toUpperCase();if(/^[A-Z0-9]{6}$/.test(h)&&!(isOnline()&&S.online.code===h))joinOnline(h,false)});
start();
</script>
